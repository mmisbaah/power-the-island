<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Power the Island: a Science Lagoon game about circuits, light and energy for Grades 1 to 6.">
<style>:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); color-scheme: light; } body { margin: 0; } img { max-width: 100%; } [hidden] { display: none !important; }</style>
<title>Power the Island</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: one column of large decisions on a lagoon-blue ground; the lab
   screen splits into drawing + controls when there is room. */
:root {
  --ground: #e6f4f3;
  --card: #ffffff;
  --ink: #12323c;
  --muted: #4d6b73;
  --line: #bcd9da;
  --sea: #0b6178;
  --sea-ink: #ffffff;
  --lagoon: #1fa2b2;
  --sand: #f2e1bd;
  --sand-deep: #d9bd86;
  --coral: #c4492f;
  --coral-soft: #fbe3dc;
  --sun: #ffc83a;
  --sun-glow: rgba(255, 200, 58, .35);
  --good: #1c7a4e;
  --good-soft: #dcf2e6;
  --bulb-off: #dfe7e8;
  --wire: #44606a;
  --plastic: #e9d7a8;
  --focus: #ff8a00;
  --wall: #f6efe0;
  --floor: #c9a26b;
  --night: #173a52;
  --dusk: #f2a96b;
  --shadow: rgba(10, 30, 45, .28);
  --display: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
  --body: "Atkinson Hyperlegible", "Verdana", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #08202a; --card: #0f2f3b; --ink: #e2f2f3; --muted: #9dbcc2; --line: #24505d;
    --sea: #5fcfdf; --sea-ink: #062029; --lagoon: #3cbccb; --sand: #3b3424; --sand-deep: #6a5a37;
    --coral: #ff8f73; --coral-soft: #3d201a; --sun: #ffd04d; --sun-glow: rgba(255, 208, 77, .3);
    --good: #6fd6a2; --good-soft: #123a2a; --bulb-off: #3a5560; --wire: #a9c3ca; --plastic: #8f7a46;
    --focus: #ffab40; --wall: #2a3a3c; --floor: #5a4630; --night: #0b2033; --dusk: #8a5a3d;
    --shadow: rgba(0, 0, 0, .45); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ground: #08202a; --card: #0f2f3b; --ink: #e2f2f3; --muted: #9dbcc2; --line: #24505d;
  --sea: #5fcfdf; --sea-ink: #062029; --lagoon: #3cbccb; --sand: #3b3424; --sand-deep: #6a5a37;
  --coral: #ff8f73; --coral-soft: #3d201a; --sun: #ffd04d; --sun-glow: rgba(255, 208, 77, .3);
  --good: #6fd6a2; --good-soft: #123a2a; --bulb-off: #3a5560; --wire: #a9c3ca; --plastic: #8f7a46;
  --focus: #ffab40; --wall: #2a3a3c; --floor: #5a4630; --night: #0b2033; --dusk: #8a5a3d;
  --shadow: rgba(0, 0, 0, .45); color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--ground);
  color: var(--ink);
  font: 1rem/1.45 var(--body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 10px;
}
html, body { height: 100%; overflow: hidden; }
#app { height: 100%; max-width: 72rem; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
h1, h2, h3, .btn, .choice, .seg, .toggle, .eyebrow, .chip, .mtitle, .steplabel, .tn, .bigswitch {
  font-family: var(--display);
}
h1 { font-size: clamp(1.7rem, 4.5vw, 2.4rem); line-height: 1.15; margin: 0; font-weight: 600; text-wrap: balance; }
h1:focus { outline: none; }
h1:focus-visible { outline: 3px solid var(--focus); outline-offset: 4px; border-radius: 6px; }
h2 { font-size: 1.35rem; margin: 0; font-weight: 600; text-wrap: balance; }
h2.sub { margin-top: 8px; }
h3 { font-size: 1.1rem; margin: 0; font-weight: 600; }
p { margin: 0; }
.lead { font-size: 1.2rem; max-width: 62ch; }
.muted { color: var(--muted); }
.small { font-size: .92rem; }
.eyebrow { display: block; text-transform: uppercase; letter-spacing: .08em; font-size: .78rem; color: var(--muted); font-weight: 500; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.between { justify-content: space-between; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }

/* Buttons */
.btn {
  min-height: 48px; padding: 10px 20px; border-radius: 14px; border: 2px solid transparent;
  font-size: 1.05rem; font-weight: 500; cursor: pointer; color: var(--ink); background: transparent;
}
.btn.primary { background: var(--sea); color: var(--sea-ink); }
.btn.primary[aria-disabled="true"] { opacity: .55; cursor: not-allowed; }
.btn.quiet { border-color: var(--line); background: var(--card); }
.btn.danger { background: var(--coral); color: var(--card); }
.btn.small { min-height: 44px; padding: 6px 14px; font-size: .95rem; }
.btn.huge { min-height: 64px; font-size: 1.35rem; width: 100%; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.link { background: none; border: 0; padding: 4px 0; color: var(--sea); font: inherit; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; min-height: 44px; }

/* Overview */
.hero { display: flex; gap: 20px; align-items: center; flex-wrap: wrap; }
.hero > div { flex: 1 1 18rem; min-width: 0; display: grid; gap: 8px; }
.hero h1 { font-size: clamp(2.2rem, 7vw, 3.4rem); color: var(--sea); }
.island { width: 160px; max-width: 40vw; }
.missions { list-style: none; padding: 0; margin: 0; display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(15rem, 1fr)); }
.mcard { background: var(--card); border-radius: 18px; padding: 18px; display: grid; gap: 10px; align-content: start; border: 2px solid var(--line); }
.mcard .btn { justify-self: start; }
.mcard.planned { background: transparent; border-style: dashed; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: .85rem; padding: 3px 10px; border-radius: 999px; border: 1.5px solid var(--line); color: var(--muted); }
.chip.done { border-color: var(--good); color: var(--good); background: var(--good-soft); }
.chip.help { border-color: var(--sand-deep); }
.chip.warn { border-color: var(--coral); color: var(--coral); }
.note { background: var(--sand); border-radius: 14px; padding: 12px 16px; display: grid; gap: 8px; }
.notice { background: var(--coral-soft); border: 2px solid var(--coral); border-radius: 14px; padding: 12px 16px; display: grid; gap: 8px; }
.notice .btn { justify-self: start; }
.panel { background: var(--card); border-radius: 18px; padding: 18px; display: grid; gap: 12px; margin-top: 12px; border: 2px solid var(--line); }
.panel .btn { justify-self: start; }
.segs { display: flex; flex-wrap: wrap; gap: 6px; }
.seg { min-height: 44px; padding: 6px 14px; border-radius: 12px; border: 2px solid var(--line); background: var(--card); color: var(--ink); font-size: 1rem; cursor: pointer; }
.seg.on { background: var(--sea); border-color: var(--sea); color: var(--sea-ink); }
.toggles { display: flex; flex-wrap: wrap; gap: 8px; }
.toggle { min-height: 44px; display: inline-flex; gap: 10px; align-items: center; padding: 6px 14px 6px 8px; border-radius: 999px; border: 2px solid var(--line); background: var(--card); color: var(--ink); font-size: 1rem; cursor: pointer; }
.toggle .knob { width: 34px; height: 20px; border-radius: 999px; background: var(--line); position: relative; }
.toggle .knob::after { content: ""; position: absolute; top: 3px; left: 3px; width: 14px; height: 14px; border-radius: 50%; background: var(--card); transition: left .15s; }
.toggle[aria-pressed="true"] .knob { background: var(--sea); }
.toggle[aria-pressed="true"] .knob::after { left: 17px; }
.foot { color: var(--muted); font-size: .92rem; display: grid; gap: 4px; border-top: 1.5px solid var(--line); padding-top: 14px; }

/* Mission frame */
.mbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
.mtitle { flex: 1 1 12rem; min-width: 0; font-size: 1.15rem; font-weight: 500; }
.stepline { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
.steplabel { font-weight: 500; color: var(--sea); }
.dots { list-style: none; display: flex; gap: 6px; padding: 0; margin: 0; }
.dots li { width: 26px; height: 8px; border-radius: 4px; background: var(--line); }
.dots li.past { background: var(--lagoon); }
.dots li.now { background: var(--sea); width: 40px; }
.screen { display: grid; gap: 16px; background: var(--card); border-radius: 22px; padding: clamp(16px, 3vw, 28px); border: 2px solid var(--line); min-width: 0; }
.stepnav { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.why { color: var(--muted); text-align: right; }
.resetbox { display: flex; justify-content: center; }
.confirm { background: var(--card); border: 2px solid var(--coral); border-radius: 14px; padding: 14px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.confirm p { flex: 1 1 100%; }
.goal { border-left: 4px solid var(--lagoon); padding-left: 12px; display: grid; gap: 2px; }
.status { display: flex; gap: 10px; align-items: center; font-weight: 700; }
.dot { width: 18px; height: 18px; flex: none; border-radius: 50%; border: 2px solid var(--wire); background: var(--bulb-off); }
.dot.on { background: var(--sun); border-color: var(--sun); box-shadow: 0 0 0 5px var(--sun-glow); }
.dot.unknown { border-style: dashed; background: transparent; }

/* Art */
.art { margin: 0; border-radius: 16px; overflow: hidden; background: var(--ground); }
.art svg { display: block; width: 100%; height: auto; }
.scene .wall { fill: var(--wall); }
.scene .floor, .desk { fill: var(--floor); }
.window { fill: #9fd6e6; stroke: var(--wire); stroke-width: 3; }
.frame { stroke: var(--wire); stroke-width: 3; }
.cloud { fill: #d5dde0; }
.door { fill: var(--sand-deep); }
.book { fill: var(--coral); }
.cord, .post, .lead { stroke: var(--wire); stroke-width: 3; fill: var(--wire); }
.shade { fill: var(--sea); }
.plate { fill: var(--card); stroke: var(--wire); stroke-width: 2; }
.rocker { fill: var(--sea); }
.tiny, .tag, .tag-sm, .sym, .bulb-mark, .gap-mark, .pic-q, .stamp-text { font-family: var(--display); text-anchor: middle; fill: var(--ink); }
.tiny { font-size: 12px; font-weight: 600; }
.shadow { fill: var(--shadow); pointer-events: none; }
.bulb-on { fill: var(--sun); stroke: #c58a00; stroke-width: 2; }
.bulb-off { fill: var(--bulb-off); stroke: var(--wire); stroke-width: 2; }
.filament { fill: none; stroke: var(--wire); stroke-width: 2; }
.glow { fill: var(--sun-glow); }
.rays line { stroke: var(--sun); stroke-width: 4; stroke-linecap: round; }
.bulb-mark { font-size: 20px; font-weight: 600; }
.sky-dusk { fill: var(--dusk); }
.sky-night { fill: var(--night); }
.sunset { fill: var(--sun); opacity: .8; }
.moon { fill: #f1f0dc; }
.sea { fill: var(--lagoon); }
.sandbank, .path { fill: var(--sand); }
.path { fill: var(--sand-deep); opacity: .6; }
.palm-trunk { fill: none; stroke: #7a5532; stroke-width: 7; stroke-linecap: round; }
.palm-leaf { fill: #2f8a57; }
.board { fill: #b98955; stroke: #7a5532; stroke-width: 5; }
.note { fill: #fffbe8; }
.note.alt { fill: #d9f1f3; }
/* diagram */
.bench { fill: var(--sand); }
.grain { fill: none; stroke: var(--sand-deep); stroke-width: 2; opacity: .6; }
.cork { fill: #c9a06a; }
.cork-frame { fill: none; stroke: #7a5532; stroke-width: 6; }
.pin { fill: var(--coral); }
.planks rect { fill: #6d5537; }
.metal { fill: none; stroke: var(--wire); stroke-width: 6; stroke-linejoin: round; stroke-linecap: round; }
.plastic { fill: none; stroke: var(--plastic); stroke-width: 12; stroke-linejoin: round; }
.plastic-stripe { fill: none; stroke: var(--sand-deep); stroke-width: 12; stroke-dasharray: 4 8; stroke-linejoin: round; }
.halo { fill: none; stroke: var(--sand); stroke-width: 16; }
.gap { fill: none; stroke: var(--coral); stroke-width: 3; stroke-dasharray: 6 7; }
.gap-badge { fill: var(--coral); }
.gap-mark { fill: #fff; font-size: 16px; font-weight: 600; }
.hl { fill: none; stroke: var(--focus); stroke-width: 22; stroke-linecap: round; stroke-linejoin: round; opacity: .55; }
.hl-ring { fill: none; stroke: var(--focus); stroke-width: 6; opacity: .7; }
.cell { fill: var(--sea); }
.cell-cap { fill: var(--wire); }
.sym { font-size: 22px; font-weight: 600; }
.lever { stroke: var(--ink); stroke-width: 6; stroke-linecap: round; }
.tag { font-size: 14px; font-weight: 600; }
.tag-on { fill: var(--ink); }
.tag-bg { fill: var(--card); stroke: var(--sand-deep); }
.tag-sm { font-size: 11px; font-weight: 600; }
.terminal { fill: var(--card); stroke: var(--ink); stroke-width: 2.5; }
.sky-night ~ .conn .metal, .sky-night ~ .part .lever { stroke: #d6e4e8; }
.sky-night ~ .part .tag, .sky-night ~ .part .sym { fill: #f1f6f7; }

/* Lab layout */
.lab { display: grid; gap: 16px; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); align-items: start; }
.lab-art, .lab-side { display: grid; gap: 12px; min-width: 0; }
@media (max-width: 760px) { .lab { grid-template-columns: minmax(0, 1fr); } }
.controls { display: grid; gap: 10px; }
.control { display: grid; gap: 6px; padding: 10px 12px; border: 2px solid var(--line); border-radius: 14px; }
.control.is-gap { border-color: var(--coral); border-style: dashed; }
.clabel { font-weight: 700; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.clabel .link { font-weight: 700; text-align: left; }
.inspector { background: var(--ground); border-radius: 14px; padding: 12px; display: grid; gap: 8px; }
.inspect-text { min-height: 3em; }
.flash { background: var(--sand); border-left: 5px solid var(--focus); padding: 10px 12px; border-radius: 10px; font-weight: 700; }
.trials { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; }
.trials li { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; align-items: baseline; }
.tn { flex: none; font-weight: 600; font-size: .85rem; padding: 2px 10px; border-radius: 999px; background: var(--ground); border: 1.5px solid var(--line); }
.bigcontrols { display: grid; gap: 12px; }
.bigswitch { min-height: 96px; border-radius: 22px; border: 3px solid var(--wire); background: var(--card); color: var(--ink); font-size: 1.5rem; font-weight: 600; display: flex; gap: 16px; align-items: center; justify-content: center; cursor: pointer; }
.bigswitch .rocker { width: 34px; height: 56px; border-radius: 8px; border: 3px solid var(--wire); background: linear-gradient(var(--sea) 50%, var(--bulb-off) 50%); }
.bigswitch.on .rocker { background: linear-gradient(var(--bulb-off) 50%, var(--sea) 50%); }
.bigswitch.on { border-color: var(--sea); }

/* Choices */
.choices { display: grid; gap: 10px; }
.choices.big { grid-template-columns: repeat(auto-fit, minmax(9rem, 1fr)); }
.choice { min-height: 56px; text-align: left; padding: 12px 16px; border-radius: 16px; border: 2.5px solid var(--line); background: var(--card); color: var(--ink); font-size: 1.08rem; cursor: pointer; display: flex; gap: 12px; align-items: center; }
.choice:disabled { opacity: .5; cursor: not-allowed; }
.choice.on { border-color: var(--sea); background: var(--ground); box-shadow: inset 0 0 0 2px var(--sea); }
.choice.on::after { content: "✔"; margin-left: auto; color: var(--sea); font-weight: 700; }
.pic-choice { flex-direction: column; text-align: center; justify-content: center; padding: 16px 10px; }
.pic-choice.on::after { margin: 0; }
.pic { width: 72px; height: 72px; flex: none; }
.predcard .pic { width: 40px; height: 40px; vertical-align: middle; margin-right: 6px; }
.pic .hand, .pic .face { fill: #d9a77a; }
.pic .mouth { fill: var(--ink); }
.pic .burst { stroke: var(--ink); stroke-width: 3; stroke-linecap: round; fill: none; }
.pic .sun { fill: var(--sun); }
.pic-bg { fill: var(--ground); stroke: var(--line); stroke-width: 2; }
.pic-q { font-size: 30px; font-weight: 600; }
.feedback { padding: 12px 14px; border-radius: 12px; font-weight: 700; }
.feedback.good, .good { background: var(--good-soft); color: var(--good); padding: 12px 14px; border-radius: 12px; }
.feedback.retry { background: var(--coral-soft); color: var(--ink); border-left: 5px solid var(--coral); }
.hints ol { list-style: none; padding: 0; margin: 0 0 8px; display: grid; gap: 8px; }
.hints li { background: var(--sand); border-radius: 12px; padding: 10px 14px; display: grid; gap: 2px; }
.aloud { display: grid; gap: 6px; justify-items: start; border-top: 1.5px dashed var(--line); padding-top: 12px; }
.evidence { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); }
@media (max-width: 640px) { .evidence { grid-template-columns: minmax(0, 1fr); } }
.predcard { background: var(--ground); border-radius: 14px; padding: 12px 14px; display: grid; gap: 4px; align-content: start; }
.checks { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
.checks li { display: flex; gap: 10px; align-items: baseline; }
.checks .tick { font-weight: 700; color: var(--muted); width: 1.2em; flex: none; }
.checks li.met .tick { color: var(--good); }
.discovery { display: flex; gap: 20px; align-items: center; flex-wrap: wrap; }
.discovery > div:last-child { flex: 1 1 16rem; min-width: 0; display: grid; gap: 10px; }
.stampwrap { width: 130px; flex: none; }
.stamp-ring { fill: none; stroke: var(--coral); stroke-width: 5; }
.stamp-ring.thin { stroke-width: 2; stroke-dasharray: 4 5; }
.stamp-text { font-size: 13px; font-weight: 600; letter-spacing: .12em; fill: var(--coral); }
.plain li { padding: 2px 0; }


/* New model scenes */
.sky-day { fill: #9fd6e6; }
.scene .sun { fill: var(--sun); }
.window.night { fill: var(--night); }
.bed { fill: var(--sea); opacity: .7; }
.pillow { fill: var(--card); }
.fan-guard { fill: none; stroke: var(--wire); stroke-width: 3; }
.blade { fill: var(--lagoon); stroke: var(--wire); stroke-width: 1.5; }
.blades.spin { animation: spin 0.6s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.wind { fill: none; stroke: var(--sea); stroke-width: 3; stroke-linecap: round; }
.beam { fill: var(--sun-glow); }
.torch-body { fill: var(--sea); }
.torch-head { fill: var(--wire); }
.panel { fill: #1d4f8a; stroke: var(--wire); stroke-width: 2; }
.panel-grid { fill: none; stroke: #9cc3ef; stroke-width: 1.5; }
.palm-leaf.big { opacity: .95; }
.shade-patch { fill: var(--shadow); }
.metal.thin { stroke-width: 3; }
.charge { fill: var(--good); }
.card { fill: #b98955; }
.glass { fill: #cfeef4; opacity: .5; stroke: #7fb9c4; stroke-width: 2; }
.ground { fill: var(--ground); }
.mirror { fill: #d9eef2; stroke: var(--wire); stroke-width: 3; }
.ray { stroke: var(--sun); stroke-width: 4; stroke-dasharray: 8 6; fill: none; }
.shadow-mark { fill: #000; opacity: .45; }
.eye { fill: var(--card); stroke: var(--ink); stroke-width: 2.5; }
.iris { fill: var(--sea); }
.dimmed { opacity: .35; }
.ins { fill: none; stroke: var(--plastic); stroke-width: 12; stroke-linejoin: round; }
.ins.m-wood { stroke: #9a6b3c; }
.ins.m-string { stroke: #f1ece0; stroke-width: 5; }
.ins.m-rubber { stroke: #d46a52; stroke-width: 7; }
.ins-stripe { fill: none; stroke: var(--sand-deep); stroke-width: 12; stroke-dasharray: 4 8; stroke-linejoin: round; opacity: .6; }
.metal.m-foil { stroke: #c9d3d6; stroke-width: 8; }
.metal.m-paperclip { stroke: #8a9aa0; stroke-width: 4; }
.metal.m-coin { stroke: #c79a3a; stroke-width: 9; }
.metal.m-coated { stroke: #2f7fb5; stroke-width: 9; }
.dot.neutral { background: var(--lagoon); border-color: var(--lagoon); }

/* Picture items */
.emoji { font-size: 2.6rem; line-height: 1; display: inline-block; }
.emoji.pic-big, .pic.pic-big { font-size: 5rem; width: 120px; height: 120px; display: grid; place-items: center; }
.choice .emoji { font-size: 2.4rem; }
.predcard .emoji { font-size: 1.6rem; vertical-align: middle; margin-right: 6px; }
.choices.items { grid-template-columns: repeat(auto-fit, minmax(7.5rem, 1fr)); }
.cat-card { display: grid; justify-items: center; gap: 8px; padding: 24px 12px; background: var(--ground); border-radius: 16px; }
.cat-name { font-family: var(--display); font-size: 1.3rem; font-weight: 600; }
.lab-wide { grid-template-columns: minmax(0, 1fr); }
.lab-wide .lab-art { position: static; }
.segs.big .seg { min-height: 56px; font-size: 1.15rem; flex: 1 1 10rem; }

/* Rooms */
.rooms { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(11rem, 1fr)); }
.room { display: grid; gap: 6px; align-content: start; justify-items: start; }
.room-btn { width: 100%; min-height: 120px; display: grid; gap: 4px; justify-items: start; text-align: left; padding: 12px 14px; border-radius: 16px; border: 2.5px solid var(--line); background: var(--night); color: #e8f2f4; cursor: pointer; font: inherit; }
.room.lit .room-btn { background: #fff4cf; color: #12323c; border-color: var(--sun); }
.room-name { font-family: var(--display); font-weight: 600; font-size: 1.15rem; }
.room-light { display: flex; gap: 6px; align-items: center; }
.room-light .pic { width: 32px; height: 32px; }


/* One-screen layout. Nothing scrolls: the top bar and bottom bar keep their
   size, the stage takes what is left, and pictures shrink to fit it. */
h1 { font-size: clamp(1.25rem, 3.2vw, 1.8rem); }
h2 { font-size: 1.1rem; }
h2.sub { margin-top: 0; }
.lead { font-size: 1.05rem; }
.small-lead { font-size: .95rem; }
.tiny { font-size: .8rem; }
.topbar { flex: none; display: flex; align-items: center; gap: 10px; min-width: 0; }
.iconbtn { flex: none; width: 44px; height: 44px; display: grid; place-items: center; border-radius: 12px; border: 2px solid var(--line); background: var(--card); color: var(--ink); font-size: 1.15rem; cursor: pointer; padding: 0; }
.iconbtn:disabled { opacity: .4; cursor: not-allowed; }
.mtitle { flex: 1 1 auto; min-width: 0; display: grid; gap: 2px; }
.mtitle .eyebrow, .mname { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mname { font-family: var(--display); font-weight: 600; font-size: 1.05rem; }
.dots li { width: 16px; height: 6px; }
.dots li.now { width: 26px; }
.stage { flex: 1 1 auto; min-height: 0; position: relative; overflow: hidden; background: var(--card); border: 2px solid var(--line); border-radius: 20px; }
.fit { height: 100%; display: flex; flex-direction: column; gap: 10px; padding: clamp(12px, 2vw, 20px); transform-origin: top left; }
.fit > * { flex: none; }
.fit > .grow, .fit > .lab, .fit > .tiles { flex: 1 1 0; min-height: 0; }
.grow { display: flex; }
.grow > .art { flex: 1 1 auto; }
.art { margin: 0; min-height: 0; display: flex; align-items: center; justify-content: center; border-radius: 14px; }
.art > svg { width: 100%; height: 100%; }
.bottombar { flex: none; display: flex; align-items: center; justify-content: space-between; gap: 10px; min-width: 0; }
.bottombar { flex-wrap: wrap; }
.bottombar .why { flex: 1 1 auto; min-width: 0; font-size: .85rem; text-align: right; color: var(--muted); }
@media (max-width: 520px) {
  .bottombar .why { order: -1; flex-basis: 100%; text-align: center; }
  .bottombar .why:empty { display: none; }
}
.bottombar.foot { justify-content: center; border: 0; padding: 0; font-size: .8rem; color: var(--muted); text-align: center; }
.notice { padding: 8px 12px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.notice p { flex: 1 1 14rem; font-size: .9rem; }
.goal { font-size: .95rem; }

/* Home */
.home .island { width: 64px; flex: none; }
.home-title { flex: 1 1 auto; min-width: 0; }
.home-title h1 { color: var(--sea); }
.graderow { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.graderow .seg { min-width: 44px; }
.tiles { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; grid-template-columns: repeat(auto-fit, minmax(9rem, 1fr)); grid-auto-rows: minmax(0, 1fr); }
.tiles li { min-height: 0; display: flex; }
.tile { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 2px; text-align: left; padding: 8px 10px; border-radius: 14px; border: 2px solid var(--line); background: var(--ground); color: var(--ink); cursor: pointer; font: inherit; overflow: hidden; }
.tile:hover { border-color: var(--sea); }
.tile-num { font-family: var(--display); font-weight: 600; color: var(--sea); font-size: .85rem; }
.tile-title { font-family: var(--display); font-weight: 600; font-size: .98rem; line-height: 1.2; }
.tile-top { display: flex; justify-content: space-between; align-items: center; gap: 6px; }
.tile-state { font-size: .72rem; color: var(--muted); margin-top: auto; }
.marks { letter-spacing: .1em; color: var(--muted); }
.mark.on { color: var(--good); }

/* Choices and buttons, compact */
.btn { min-height: 44px; padding: 8px 16px; font-size: 1rem; }
.btn.big { min-height: 52px; font-size: 1.15rem; width: 100%; }
.choices { gap: 8px; }
.choice { min-height: 46px; padding: 8px 12px; font-size: 1rem; border-radius: 14px; }
.pic-choice { padding: 8px; gap: 4px; }
.pic { width: 56px; height: 56px; }
.choice .emoji { font-size: 2rem; }
.choices.big { grid-template-columns: repeat(auto-fit, minmax(7rem, 1fr)); }
.predcard { padding: 8px 12px; display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; font-size: .95rem; }
.predcard .pic { width: 28px; height: 28px; }
.checks { gap: 4px; font-size: .95rem; }
.trialbox { display: grid; gap: 6px; }
.trials { gap: 4px; font-size: .9rem; }
.pager { display: flex; align-items: center; gap: 6px; font-size: .85rem; color: var(--muted); }
.pager .iconbtn { width: 40px; height: 40px; font-size: .9rem; }
.hints { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.hint { flex: 1 1 16rem; background: var(--sand); border-radius: 12px; padding: 8px 12px; font-size: .95rem; display: grid; gap: 2px; }
.feedback { padding: 8px 12px; font-size: .95rem; }
.good { padding: 8px 12px; }
.note { padding: 8px 12px; gap: 8px; }
.confirm { flex: 1; display: grid; align-content: center; justify-items: start; gap: 12px; border: 0; padding: 0; }
.discovery { gap: 14px; }
.stampwrap { width: 96px; }
.discovery .lead { font-size: 1rem; }

/* Lab */
.lab { display: grid; grid-template-rows: minmax(0, 1fr) auto; grid-template-columns: minmax(0, 1fr); gap: 10px; align-items: stretch; }
.lab-art { min-height: 0; display: flex; flex-direction: column; gap: 6px; position: static; }
.lab-art > .art { flex: 1 1 0; min-height: 60px; }
.lab-side { display: flex; flex-direction: column; gap: 8px; min-height: 0; }
@media (min-width: 720px) and (min-aspect-ratio: 5/4) {
  .lab { grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); }
}
.status { font-size: .92rem; align-items: flex-start; }
.status .dot { margin-top: 2px; }
.count { margin-left: auto; flex: none; font-family: var(--display); font-size: .8rem; color: var(--muted); padding: 1px 8px; border: 1.5px solid var(--line); border-radius: 999px; }
.flash { padding: 8px 10px; font-size: .95rem; }
.controls { gap: 6px; }
.control { padding: 6px 10px; gap: 4px; border-radius: 12px; }
.clabel { font-size: .9rem; }
.seg { min-height: 42px; padding: 6px 12px; }
.bigcontrols { display: grid; gap: 8px; grid-template-columns: repeat(auto-fit, minmax(9rem, 1fr)); }
.bigswitch { min-height: 64px; font-size: 1.2rem; gap: 10px; border-radius: 18px; }
.bigswitch .rocker { width: 26px; height: 42px; }
.segs.big .seg { min-height: 64px; }
.partpanel { display: grid; gap: 6px; background: var(--ground); border-radius: 14px; padding: 8px; }
.partbar { display: flex; gap: 8px; align-items: center; }
.part-text { flex: 1 1 auto; min-width: 0; font-size: .9rem; line-height: 1.3; }
.partchips { display: flex; flex-wrap: wrap; gap: 6px; }
.partchip { min-height: 40px; padding: 4px 12px; border-radius: 999px; border: 2px solid var(--line); background: var(--card); color: var(--ink); font: 500 .9rem var(--display); cursor: pointer; }
.partchip.on { background: var(--sea); border-color: var(--sea); color: var(--sea-ink); }
.partchip.gap { border-color: var(--coral); border-style: dashed; }
.partopts .seg { flex: 1 1 auto; }
.kind-catalogue .choices.items { grid-template-columns: repeat(auto-fit, minmax(5.2rem, 1fr)); }
.kind-catalogue .pic-choice { min-height: 0; padding: 6px 4px; font-size: .85rem; }
.kind-catalogue .pic-choice .emoji { font-size: 1.7rem; }
.kind-catalogue .pic-choice .pic { width: 36px; height: 36px; }
.cat-card { flex: 1; width: 100%; height: 100%; padding: 8px; align-content: center; }
.emoji.pic-big, .pic.pic-big { font-size: clamp(2.5rem, 9vh, 5rem); width: auto; height: auto; max-height: 100%; }
.rooms-art { display: block; overflow: hidden; }
.rooms { height: 100%; gap: 8px; grid-template-columns: repeat(auto-fit, minmax(8.5rem, 1fr)); grid-auto-rows: minmax(0, 1fr); }
.room { min-height: 0; }
.room-btn { min-height: 0; height: 100%; padding: 8px 10px; gap: 2px; font-size: .88rem; }
.room-name { font-size: 1rem; }
.room-light .pic { width: 24px; height: 24px; }
.room .chip { font-size: .75rem; padding: 0 8px; }
.room { display: grid; grid-template-rows: 1fr auto; }


/* Wide stages put list answers side by side; short screens tighten up so
   the stage rarely has to shrink. */
.choices.list { grid-template-columns: repeat(auto-fit, minmax(15rem, 1fr)); }
.choices.big { grid-template-columns: repeat(auto-fit, minmax(5.8rem, 1fr)); }
@media (max-height: 760px) {
  body { padding-block: 6px; }
  #app { gap: 6px; }
  .fit { gap: 8px; padding: 10px 12px; }
  .pic { width: 44px; height: 44px; }
  .choice .emoji { font-size: 1.6rem; }
  .choice { min-height: 42px; padding: 6px 10px; }
  .goal .eyebrow { display: none; }
}
@media (max-height: 520px) {
  body { padding-block: 4px; }
  .iconbtn { width: 38px; height: 38px; font-size: 1rem; }
  .btn { min-height: 38px; padding: 4px 12px; font-size: .95rem; }
  .btn.big { min-height: 42px; font-size: 1.05rem; }
  .dots, .home-title p, .home .island { display: none; }
  .mname { font-size: .95rem; }
  h1 { font-size: 1.1rem; }
  .lead, .small-lead, .goal, .hint, .feedback, .status, .checks, .trials, .part-text { font-size: .85rem; }
  .fit { gap: 6px; padding: 8px 10px; }
  .pic { width: 34px; height: 34px; }
  .pic-choice { flex-direction: row; text-align: left; }
  .seg, .partchip { min-height: 36px; }
  .bigswitch { min-height: 48px; font-size: 1.05rem; }
  .segs.big .seg { min-height: 48px; }
  .stampwrap { width: 64px; }
  .tiles { grid-template-columns: repeat(5, minmax(0, 1fr)); }
  .tile-title { font-size: .85rem; }
  .bottombar .why { font-size: .78rem; }
}


/* The house: a cutaway with a tiled roof, wall frame, floor slabs and 3D
   rooms. Each grade has its own floor plan (set inline as grid rows and
   columns). The selected room's mission shows in the card underneath. */
.house3d { flex: 1 1 0; min-height: 0; display: flex; flex-direction: column; position: relative; padding: 0 4%; }
.roof3d { flex: none; height: clamp(34px, 12%, 86px); position: relative; margin: 0 -3%; isolation: isolate; }
.roof3d::before { content: ""; position: absolute; inset: 0; clip-path: polygon(50% 0, 100% 100%, 0 100%);
  background: repeating-linear-gradient(0deg, #a8432f 0 3px, #c4553d 3px 11px); }
.roof3d::after { content: ""; position: absolute; left: 0; right: 0; bottom: -4px; height: 6px; background: #7a2f22; border-radius: 3px; }
.chimney3d { position: absolute; right: 22%; bottom: 30%; width: 4%; min-width: 12px; height: 50%; z-index: -1;
  background: repeating-linear-gradient(0deg, #8f5f3c 0 4px, #a7744d 4px 8px); }
.roof-sign { position: absolute; left: 50%; bottom: 8%; transform: translateX(-50%); white-space: nowrap; padding: 1px 8px; border-radius: 4px;
  font: 600 .72rem var(--display); letter-spacing: .06em; text-transform: uppercase; color: #fff; background: rgba(60, 20, 10, .45); }
.floors3d { flex: 1 1 0; min-height: 0; list-style: none; margin: 0; padding: 5px; display: grid; gap: 5px;
  grid-template-columns: repeat(6, minmax(0, 1fr)); background: #e8dcc4; border: 4px solid #b9a27e; border-top: 0;
  background-image: linear-gradient(#cbb894, #cbb894); background-size: 100% 5px; }
.cell { min-width: 0; min-height: 0; display: flex; }
.ground3d { flex: none; height: 12px; margin: 0 -4%; border-radius: 0 0 10px 10px;
  background: linear-gradient(#5aa05f 0 40%, #e3cf9f 40%); }
.room3d { flex: 1; min-width: 0; min-height: 0; position: relative; overflow: hidden; padding: 0; border: 0; border-radius: 3px;
  cursor: pointer; background: #1b2a33; container-type: size; }
.room3d .shell, .room3d .furniture { position: absolute; inset: 0; width: 100%; height: 100%; }
.room3d .furniture { top: 14%; left: 8%; width: 84%; height: 72%; }
.room3d::after { content: ""; position: absolute; inset: 0; pointer-events: none; transition: background .4s; }
.room3d.dark::after { background: rgba(8, 20, 32, .72); }
.room3d.dim::after { background: rgba(8, 20, 32, .48); }
.room3d.warm::after { background: radial-gradient(circle at 50% 16%, rgba(255, 200, 58, .18), rgba(40, 25, 5, .18) 70%); }
.room3d.bright::after { background: radial-gradient(circle at 50% 14%, rgba(255, 214, 90, .45), rgba(255, 214, 90, 0) 60%); }
.room3d.sel { outline: 4px solid var(--sun); outline-offset: -4px; }
.room3d:focus-visible { outline: 4px solid var(--focus); outline-offset: -4px; }
.lamp { position: absolute; top: 0; left: 50%; width: 2px; height: 9%; background: #3d3d3d; z-index: 2; }
.lamp::after { content: ""; position: absolute; top: 100%; left: -6px; width: 14px; height: 8px; border-radius: 0 0 8px 8px; background: #5d6a70; }
.room3d.warm .lamp::after { background: #f0b941; box-shadow: 0 2px 10px 3px rgba(255, 190, 60, .5); }
.room3d.bright .lamp::after { background: #ffe27a; box-shadow: 0 2px 22px 10px rgba(255, 214, 90, .8); }
.room-plate { position: absolute; left: 3px; top: 3px; z-index: 3; display: flex; align-items: center; gap: 4px; max-width: calc(100% - 6px);
  padding: 1px 6px 1px 1px; border-radius: 999px; background: rgba(255, 255, 255, .9); color: #12323c; font: 600 .7rem var(--display); }
.room-n { flex: none; display: grid; place-items: center; width: 1.5em; height: 1.5em; border-radius: 50%; background: var(--sea); color: #fff; }
.room-label { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.room-marks { position: absolute; right: 4px; bottom: 3px; z-index: 3; font-size: .62rem; letter-spacing: .08em; color: #fff;
  text-shadow: 0 1px 2px #000; }
.room-marks .on { color: #ffe27a; }
.room-title { position: absolute; left: 4px; right: 4px; bottom: 16px; z-index: 3; display: none; padding: 2px 6px; border-radius: 6px;
  background: rgba(12, 30, 40, .72); color: #fff; font: 600 .74rem/1.2 var(--display); text-align: left; }
@container (max-width: 74px) { .room-label { display: none; } }
@container (min-width: 140px) and (min-height: 96px) { .room-title { display: block; } }
.roomcard { flex: none; display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 14px; background: var(--ground); border: 2px solid var(--line); }
.roomcard-text { flex: 1 1 auto; min-width: 0; display: grid; gap: 1px; }
.roomcard-text .eyebrow { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.roomcard-title { font: 600 1.05rem/1.2 var(--display); }
.roomcard-goal { font-size: .85rem; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
.roomcard .btn { flex: none; }
.litcount { font-size: .8rem; color: var(--muted); }
.housepick { margin-left: auto; display: flex; align-items: center; gap: 6px; }
.house-label { display: grid; justify-items: center; line-height: 1.15; font-family: var(--display); font-size: .9rem; min-width: 6.5rem; }
@media (max-width: 520px) { .graderow .seg { min-width: 38px; padding: 6px 8px; } .housepick { margin-left: 0; width: 100%; justify-content: space-between; } }
@media (max-height: 520px) {
  .roomcard-goal { display: none; }
  .roof3d { height: 30px; }
}


/* The neighbourhood: ten buildings on island streets. Tall screens show two
   per row, wide screens five. */
.street { flex: 1 1 0; min-height: 0; list-style: none; margin: 0; padding: 8px 8px 0; display: grid; gap: 4px 10px;
  grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: repeat(5, minmax(0, 1fr));
  border-radius: 14px; background: linear-gradient(#bfe4f2, #e3f3f7 55%, #e8dcc4 55%); }
.lot { grid-row: var(--r2); grid-column: var(--c2); min-height: 0; display: flex;
  background: linear-gradient(to top, #a7a196 0 7px, #d9cfb8 7px 10px, transparent 10px); }
@media (min-aspect-ratio: 1/1) {
  .street { grid-template-columns: repeat(5, minmax(0, 1fr)); grid-template-rows: repeat(2, minmax(0, 1fr));
    background: linear-gradient(#bfe4f2, #e3f3f7 40%, #e8dcc4 40%); }
  .lot { grid-row: var(--r5); grid-column: var(--c5); }
}
.lotbtn { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; align-items: stretch; gap: 2px;
  padding: 2px 2px 10px; border: 0; background: none; cursor: pointer; border-radius: 10px; font: inherit; color: #12323c; }
.lotbtn .building { flex: 1 1 0; min-height: 0; width: 100%; transition: transform .2s; }
.lotbtn:hover .building, .lotbtn:focus-visible .building { transform: translateY(-3px); }
.lotbtn:focus-visible { outline: 3px solid var(--focus); outline-offset: -1px; }
.lot-sign { flex: none; display: flex; align-items: center; gap: 4px; justify-content: center; min-width: 0;
  font: 600 .74rem var(--display); background: rgba(255, 255, 255, .85); border-radius: 999px; padding: 1px 6px 1px 2px; align-self: center; max-width: 100%; }
.lot-n { flex: none; display: grid; place-items: center; width: 1.5em; height: 1.5em; border-radius: 50%; background: var(--sea); color: #fff; }
.lot-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lot-lit { flex: none; color: #7a5a10; }
.lotbtn.last .lot-sign { box-shadow: 0 0 0 2px var(--sun); }
.lotbtn.done .lot-sign { background: #fff1c2; }
.street-count { margin-left: auto; }
@media (max-height: 520px) { .lot-sign { font-size: .66rem; } }

/* Motion */
.glow { animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .55; } }
.stampwrap svg { animation: stampin .5s ease-out both; }
@keyframes stampin { from { transform: scale(1.4) rotate(-12deg); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
.calm *, .calm *::before, .calm *::after { animation: none !important; transition: none !important; }
</style>
