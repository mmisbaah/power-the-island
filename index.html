<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Power the Island</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<style>
/* Layout: one centred column (max 760px). Island band on top, then one decision per screen; the circuit diagram spans the column. */
:root{
  --bg:#e9f5f4; --surface:#ffffff; --surface-2:#d5eeeb; --line:#b9dbd7;
  --ink:#0c2a31; --ink-soft:#456169;
  --lagoon:#08798a; --lagoon-strong:#055a66; --on-lagoon:#ffffff;
  --sun:#ffc93c; --sun-deep:#d99a00; --coral:#d4473c; --ok:#1d7f47; --focus:#f0a400;
  --copper:#b9611f; --plastic:#9aa8ae;
  --sky:#9fd9e6; --sea:#36b3c2; --sand:#efd9a7; --wood:#8a5a36; --leaf:#2f8f5b; --paper:#fffaf0;
  --wall:#cfe3e6; --dim:#2b4954; --window:#5d8fb0; --night:#1d3557;
  --display:'Fredoka','Trebuchet MS',system-ui,sans-serif;
  --body:'Nunito','Segoe UI',system-ui,sans-serif;
  --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#071d26; --surface:#0d2c38; --surface-2:#143c4a; --line:#215060;
  --ink:#e4f3f2; --ink-soft:#9dbcc2;
  --lagoon:#3cc3cf; --lagoon-strong:#86dfe6; --on-lagoon:#04222a;
  --sun:#ffd257; --sun-deep:#f2b200; --coral:#ff7a6c; --ok:#4cc985; --focus:#ffbf3a;
  --copper:#e08a4a; --plastic:#7d8e95;
  --sky:#1b4b63; --sea:#12707e; --sand:#8b7650; --wood:#a06c45; --leaf:#3aa56b; --paper:#e9e3d3;
  --wall:#18394a; --dim:#0a1a22; --window:#1e3d57; --night:#050f1c;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#071d26; --surface:#0d2c38; --surface-2:#143c4a; --line:#215060;
  --ink:#e4f3f2; --ink-soft:#9dbcc2;
  --lagoon:#3cc3cf; --lagoon-strong:#86dfe6; --on-lagoon:#04222a;
  --sun:#ffd257; --sun-deep:#f2b200; --coral:#ff7a6c; --ok:#4cc985; --focus:#ffbf3a;
  --copper:#e08a4a; --plastic:#7d8e95;
  --sky:#1b4b63; --sea:#12707e; --sand:#8b7650; --wood:#a06c45; --leaf:#3aa56b; --paper:#e9e3d3;
  --wall:#18394a; --dim:#0a1a22; --window:#1e3d57; --night:#050f1c;
  color-scheme:dark}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55}
.wrap{max-width:760px;margin:0 auto;padding-block:16px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--display);font-weight:600;line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:2.1rem;letter-spacing:.01em} h2{font-size:1.6rem} h3{font-size:1.15rem}
h2:focus{outline:none} h2:focus-visible{outline:3px solid var(--focus);outline-offset:4px;border-radius:6px}
p{margin:0}
a{color:var(--lagoon-strong)}
.sr{position:absolute;top:0;left:0;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.eyebrow{font-size:.8rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft)}
.muted{color:var(--ink-soft)}
.small{font-size:.9rem}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.spread{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}

/* top bar */
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:600;color:var(--lagoon-strong);font-size:1.05rem;display:flex;align-items:center;gap:8px}
.brand svg{width:26px;height:26px}

/* buttons */
.btn{font:inherit;font-weight:700;min-height:48px;padding:10px 20px;border-radius:999px;border:2px solid var(--lagoon);background:var(--surface);color:var(--lagoon-strong);cursor:pointer;display:inline-flex;align-items:center;gap:8px;justify-content:center;text-decoration:none}
.btn.primary{background:var(--lagoon);color:var(--on-lagoon)}
.btn.quiet{border-color:transparent;background:transparent;text-decoration:underline;text-underline-offset:3px;padding-inline:8px}
.btn.big{min-height:60px;font-size:1.15rem;padding-inline:30px}
.btn.danger{border-color:var(--coral);color:var(--coral)}
.btn:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px}

/* cards & panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.note{border-left:5px solid var(--lagoon);background:var(--surface-2);border-radius:10px;padding:12px 14px}
.note.warn{border-left-color:var(--coral)}
.note.good{border-left-color:var(--ok)}

/* island band */
.band{border-radius:22px;overflow:hidden;background:var(--sky);position:relative}
.band svg{display:block;width:100%;height:auto}
.band .cap{position:absolute;left:18px;bottom:16px;right:18px;color:var(--ink)}

/* step progress */
.steps{list-style:none;margin:0;padding:0;display:flex;gap:6px;flex-wrap:wrap}
.steps li{font-size:.78rem;font-weight:700;padding:4px 10px;border-radius:999px;border:1.5px solid var(--line);color:var(--ink-soft);display:flex;align-items:center;gap:5px}
.steps li.done{border-color:var(--lagoon);color:var(--lagoon-strong)}
.steps li.done::before{content:"✓"}
.steps li[aria-current="step"]{background:var(--lagoon);border-color:var(--lagoon);color:var(--on-lagoon)}

/* choices */
.choices{display:grid;gap:10px}
.choice{display:flex;align-items:center;gap:12px;text-align:left;width:100%;min-height:56px;padding:12px 16px;border:2px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);font:inherit;cursor:pointer}
.choice .dot{flex:none;width:22px;height:22px;border-radius:50%;border:2.5px solid var(--ink-soft);display:grid;place-items:center;font-size:14px;font-weight:800;line-height:1}
.choice[aria-pressed="true"]{border-color:var(--lagoon);background:var(--surface-2)}
.choice[aria-pressed="true"] .dot{background:var(--lagoon);border-color:var(--lagoon);color:var(--on-lagoon)}
.choice[aria-pressed="true"] .dot::after{content:"✓"}
.pics{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.pic{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 10px;border:2.5px solid var(--line);border-radius:18px;background:var(--surface);color:var(--ink);font:inherit;font-weight:700;font-size:1.05rem;cursor:pointer;text-align:center;min-height:150px}
.pic svg{width:92px;height:92px}
.pic[aria-pressed="true"]{border-color:var(--lagoon);background:var(--surface-2);box-shadow:inset 0 0 0 2px var(--lagoon)}
.pic[aria-pressed="true"] span::before{content:"✓ "}

/* circuit */
.figure{margin:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:8px}
.figure svg{width:100%;height:auto;display:block;max-width:100%}
.status{display:flex;align-items:center;gap:10px;font-weight:800;padding:8px 12px;border-radius:12px;background:var(--surface-2)}
.status .ic{width:28px;height:28px;flex:none}
.w-metal{fill:none;stroke:var(--copper);stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.w-plastic{fill:none;stroke:var(--plastic);stroke-width:10;stroke-linejoin:round}
.w-plastic-dash{fill:none;stroke:var(--surface);stroke-width:3;stroke-dasharray:5 7}
.w-gap{fill:none;stroke:var(--ink-soft);stroke-width:2;stroke-dasharray:2 8;stroke-linecap:round}
.w-loose{fill:none;stroke:var(--copper);stroke-width:5;stroke-linecap:round}
.hit{fill:none;stroke:transparent;stroke-width:26;pointer-events:stroke;cursor:pointer}
.hit-c{fill:transparent;cursor:pointer}
.hl{fill:none;stroke:var(--focus);stroke-width:18;stroke-linejoin:round;stroke-linecap:round;opacity:.5}
.hl-c{fill:var(--focus);opacity:.35}
.sym{fill:none;stroke:var(--ink);stroke-width:3;stroke-linecap:round}
.term{fill:var(--surface);stroke:var(--ink);stroke-width:2.5}
.glass{fill:var(--surface);stroke:var(--ink);stroke-width:3}
.lit .glass{fill:var(--sun)}
.ray{stroke:var(--sun-deep);stroke-width:3.5;stroke-linecap:round}
.lbl{font:700 12.5px var(--body);fill:var(--ink-soft)}
.lbl-strong{font:800 13px var(--body);fill:var(--ink)}
.lbl-gap{font:800 13px var(--body);fill:var(--coral)}
.lbl-plastic{font:800 12px var(--body);fill:var(--ink)}
.board{fill:var(--surface)}

/* scene */
.sc-sky{fill:var(--sky)} .sc-sea{fill:var(--sea)} .sc-sand{fill:var(--sand)} .sc-wood{fill:var(--wood)} .sc-leaf{fill:var(--leaf)} .sc-paper{fill:var(--paper)}
.sc-wall{fill:var(--wall)} .sc-dim{fill:var(--dim)} .sc-window{fill:var(--window)} .sc-ink{fill:var(--ink)} .sc-line{stroke:var(--ink);fill:none;stroke-width:3;stroke-linecap:round}
.sc-sun{fill:var(--sun)} .sc-surface{fill:var(--surface)} .sc-coral{fill:var(--coral)} .sc-lagoon{fill:var(--lagoon)}
.glow{fill:var(--sun);opacity:.28}

/* parts list */
.parts{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
.part{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;min-height:64px;padding:10px 14px;border:2px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);font:inherit;cursor:pointer}
.part b{font-weight:800}
.part span{font-size:.9rem;color:var(--ink-soft)}
.part[aria-pressed="true"]{border-color:var(--focus);box-shadow:inset 0 0 0 2px var(--focus)}
.chooser{border:2px dashed var(--focus);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}

/* checklist & tables */
.check{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.check li{display:flex;gap:10px;align-items:flex-start}
.check .box{flex:none;width:24px;height:24px;border-radius:7px;border:2.5px solid var(--ink-soft);display:grid;place-items:center;font-weight:900;font-size:14px;margin-top:1px}
.check li.met .box{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.check li.met .box::after{content:"✓"}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.95rem;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft)}
.pill{display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:.85rem;padding:3px 10px;border-radius:999px;border:2px solid currentColor;white-space:nowrap}
.pill.on{color:var(--sun-deep)} .pill.on::before{content:"✷"}
.pill.off{color:var(--ink-soft)} .pill.off::before{content:"○"}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:.8rem;font-weight:800;padding:3px 10px;border-radius:999px;border:1.5px solid var(--line);color:var(--ink-soft)}
.chip.yes{border-color:var(--ok);color:var(--ok)} .chip.yes::before{content:"✓ "}
.chip.assist{border-color:var(--sun-deep);color:var(--sun-deep)}

/* missions */
.missions{display:grid;gap:12px}
.mcard{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.mcard .num{grid-row:span 3;font-family:var(--display);font-size:1.8rem;font-weight:600;color:var(--lagoon);width:2.4ch;text-align:center;line-height:1.1}
.mcard.planned{background:transparent;border-style:dashed}
.mcard.planned .num{color:var(--ink-soft)}
.mcard .acts{grid-column:2;display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:6px}
.gradesel{display:flex;flex-wrap:wrap;gap:8px}
.gradesel button{min-width:56px}
.gradesel button[aria-pressed="true"]{background:var(--lagoon);color:var(--on-lagoon)}
.nav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:16px}
.feedback{border-radius:12px;padding:12px 14px;font-weight:600;display:flex;gap:10px;align-items:flex-start}
.feedback.ok{background:var(--surface-2);border:2px solid var(--ok)}
.feedback.ok::before{content:"✓";color:var(--ok);font-weight:900}
.feedback.retry{background:var(--surface-2);border:2px solid var(--sun-deep)}
.feedback.retry::before{content:"↻";color:var(--sun-deep);font-weight:900}
.hintbox{background:var(--surface-2);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.stamp{width:120px;height:120px;flex:none}
details{border:1px solid var(--line);border-radius:12px;padding:10px 14px;background:var(--surface)}
summary{cursor:pointer;font-weight:800}
details[open] summary{margin-bottom:10px}
textarea{width:100%;min-height:140px;font:13px ui-monospace,SFMono-Regular,Menlo,monospace;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:10px;box-sizing:border-box}
dl.rec{display:grid;grid-template-columns:minmax(120px,max-content) 1fr;gap:6px 14px;margin:0;font-size:.92rem}
dl.rec dt{font-weight:800;color:var(--ink-soft)} dl.rec dd{margin:0;min-width:0;overflow-wrap:anywhere}
.pass{color:var(--ok);font-weight:800} .fail{color:var(--coral);font-weight:800}
@media (prefers-reduced-motion: no-preference){
  html:not(.rm) .lit .ray{animation:pulse 1.6s ease-in-out infinite}
  html:not(.rm) .screen{animation:rise .25s ease-out}
}
@keyframes pulse{50%{opacity:.45}}
@keyframes rise{from{transform:translateY(6px)}}
@media (max-width:480px){h1{font-size:1.7rem} h2{font-size:1.35rem} .mcard{grid-template-columns:1fr} .mcard .num{grid-row:auto;text-align:left} .mcard .acts{grid-column:1}}
/* sort, sequence and solar controls */
.sortlist{display:flex;flex-direction:column;gap:10px}
.sortitem{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:10px 12px;border:2px solid var(--line);border-radius:14px;background:var(--surface)}
.sortitem.redo{border-color:var(--sun-deep)}
.sortitem .what{display:flex;align-items:center;gap:10px;flex:1 1 180px;min-width:0;font-weight:700}
.sortitem .what svg{width:52px;height:52px;flex:none}
.binbtns{display:flex;flex-wrap:wrap;gap:6px}
.binbtns button{min-height:44px;padding:6px 14px;font-size:.92rem}
.binbtns button[aria-pressed="true"]{background:var(--lagoon);color:var(--on-lagoon)}
.flag{font-size:.82rem;font-weight:800;color:var(--sun-deep)}
.slots{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;counter-reset:s}
.slots li{display:flex;align-items:center;gap:12px;min-height:56px;padding:8px 12px;border:2px dashed var(--line);border-radius:14px;background:var(--surface)}
.slots li.filled{border-style:solid;border-color:var(--lagoon)}
.slots li .n{flex:none;width:30px;height:30px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-weight:900;color:var(--lagoon-strong)}
.slots li svg{width:44px;height:44px;flex:none}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.card{display:flex;align-items:center;gap:10px;text-align:left;min-height:60px;padding:10px 12px;border:2px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);font:inherit;font-weight:700;cursor:pointer}
.card svg{width:44px;height:44px;flex:none}
.chain{display:flex;flex-direction:column;gap:4px}
.chain .link{display:flex;align-items:center;gap:10px;font-weight:700}
.chain .link svg{width:40px;height:40px;flex:none}
.chain .arrow{color:var(--lagoon);font-weight:900;padding-left:12px}
.seg{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg .k{font-weight:800;flex:0 0 100%}
.seg button[aria-pressed="true"]{background:var(--lagoon);color:var(--on-lagoon)}
.sc-night{fill:var(--night)} .sc-moon{fill:var(--paper)}
.mgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.summary-line{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}

/* home: grade cards */
.gradegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.gradecard{display:flex;flex-direction:column;align-items:stretch;gap:4px;text-align:left;padding:0 0 14px;border:2px solid var(--line);border-radius:20px;background:var(--surface);color:var(--ink);font:inherit;cursor:pointer;overflow:hidden}
.gradecard svg{display:block;width:100%;height:auto;margin-bottom:8px}
.gradecard > span{padding-inline:16px}
.gradecard:hover{border-color:var(--lagoon)}
.gradecard.current{border-color:var(--lagoon);box-shadow:inset 0 0 0 1px var(--lagoon)}
.gc-name{font-family:var(--display);font-size:1.45rem;font-weight:600;color:var(--lagoon-strong)}
.gc-topic{font-weight:600;line-height:1.35}
.gc-lights{font-size:.82rem;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-soft);margin-top:4px}
@media (max-width:480px){.gradegrid{grid-template-columns:1fr 1fr;gap:10px}.gc-topic{font-size:.88rem}.gc-name{font-size:1.2rem}.gradecard > span{padding-inline:10px}}

/* island map, guide, big sort card, celebration */
.band.map{background:var(--night)}
.spot{cursor:pointer}
.spot:hover .glass{stroke:var(--sun)}
.spot.lit .glass{fill:var(--sun)}
.guide{display:flex;align-items:flex-end;gap:10px}
.guide .turtle{width:78px;height:62px;flex:none}
.bubble{position:relative;flex:1;min-width:0;background:var(--surface);border:2px solid var(--lagoon);border-radius:18px 18px 18px 4px;padding:12px 16px;font-size:1.08rem;font-weight:600}
.bubble::before{content:"";position:absolute;left:-9px;bottom:10px;width:14px;height:14px;background:var(--surface);border-left:2px solid var(--lagoon);border-bottom:2px solid var(--lagoon);transform:rotate(45deg)}
.bigcard{display:flex;flex-direction:column;align-items:center;gap:6px;padding:18px;background:var(--surface);border:2.5px solid var(--lagoon);border-radius:22px;text-align:center}
.bigcard-name{font-family:var(--display);font-size:1.5rem;font-weight:600}
.minis{display:flex;flex-wrap:wrap;gap:8px}
.mini{display:flex;align-items:center;gap:6px;min-height:52px;padding:4px 12px 4px 6px;border:2px solid var(--line);border-radius:999px;background:var(--surface);color:var(--ink);font:inherit;font-size:.85rem;font-weight:800;cursor:pointer}
.mini.redo{border-color:var(--sun-deep);box-shadow:inset 0 0 0 1px var(--sun-deep)}
@media (prefers-reduced-motion: no-preference){
  html:not(.rm) .spot.pop{animation:pop .9s ease-out 2;transform-box:fill-box;transform-origin:center}
  html:not(.rm) .celebrate .stamp{animation:stampIn .6s cubic-bezier(.2,1.4,.4,1)}
  html:not(.rm) .bigcard{animation:rise .25s ease-out}
}
@keyframes pop{0%{opacity:.3}40%{opacity:1}60%{opacity:.6}100%{opacity:1}}
@keyframes stampIn{from{transform:scale(1.7) rotate(-14deg);opacity:.2}to{transform:none;opacity:1}}

/* main tabs, player card, stars, sparks */
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;border-bottom:2px solid var(--line);padding-bottom:8px}
.tab{font:inherit;font-weight:800;font-size:1rem;min-height:44px;padding:8px 4px;min-width:0;border-radius:999px;border:2px solid transparent;background:transparent;color:var(--ink-soft);cursor:pointer}
.tab[aria-current="page"]{background:var(--lagoon);color:var(--on-lagoon)}
.tab:hover{border-color:var(--line)}
.player-row{display:flex;gap:14px;align-items:center}
.player .turtle{width:84px;height:68px;flex:none}
.lvl{display:flex;flex-direction:column;gap:6px}
.lvl-top{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 10px}
.bar{height:12px;border-radius:999px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
.bar span{display:block;height:100%;background:var(--sun);border-right:2px solid var(--sun-deep)}
.statrow{display:flex;flex-wrap:wrap;gap:6px 16px;font-variant-numeric:tabular-nums}
.stat{display:inline-flex;align-items:center;gap:5px}
.spark-ic{width:20px;height:20px;flex:none}
.stars{display:inline-flex;gap:1px;font-size:1.15rem;line-height:1;letter-spacing:1px}
.stars span{color:var(--line)}
.stars span.on{color:var(--sun-deep)}
.toasts{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.toast{pointer-events:none;position:relative;display:flex;align-items:center;gap:12px;max-width:380px;width:100%;background:var(--surface);color:var(--ink);border:2px solid var(--sun-deep);border-radius:18px;padding:10px 14px;box-shadow:0 8px 24px rgba(0,0,0,.18);transition:opacity .4s,transform .4s}
.toast .medal,.toast .turtle{width:52px;height:52px;flex:none}
.toast.out{opacity:0;transform:translateY(12px)}
/* games */
.gamegrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.gamecard{display:flex;gap:14px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.gc-art svg{width:64px;height:64px}
.dots{display:flex;gap:6px}
.dots span{width:14px;height:14px;border-radius:50%;border:2px solid var(--line)}
.dots span.now{border-color:var(--lagoon)}
.dots span.ok{background:var(--ok);border-color:var(--ok)}
.dots span.fix{background:var(--sun);border-color:var(--sun-deep)}
.pairgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.paircard{aspect-ratio:1/1;max-width:100%;display:grid;place-items:center;border-radius:16px;border:2px solid var(--lagoon);background:var(--lagoon);color:var(--on-lagoon);font:inherit;cursor:pointer;padding:6px;min-width:0}
.paircard .back{font-size:1.6rem}
.paircard.up{background:var(--surface);color:var(--ink)}
.paircard.matched{border-color:var(--ok);background:var(--surface-2);cursor:default}
.paircard .pw{font-weight:800;font-size:.95rem;line-height:1.2;text-align:center;overflow-wrap:anywhere}
@media (max-width:480px){.pairgrid{grid-template-columns:repeat(3,1fr)}.gamecard{flex-direction:column}}
/* badges and shop */
.badgegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.badge{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;padding:14px 10px;border:1px dashed var(--line);border-radius:16px}
.badge.on{border-style:solid;border-color:var(--sun-deep);background:var(--surface)}
.medal{width:72px;height:72px}
.shopgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.shopitem{display:flex;flex-direction:column;gap:6px;padding:14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.shopitem.owned{border-color:var(--lagoon)}
.si-art{height:96px;display:grid;place-items:center;border-radius:12px;background:var(--surface-2);overflow:hidden}
.si-art svg{height:88px;width:auto;max-width:100%}
@media (prefers-reduced-motion: reduce){.toast{transition:none}}
html.rm .toast{transition:none}

.toast .more{position:absolute;top:-8px;right:-6px;background:var(--lagoon);color:var(--on-lagoon);font-size:.75rem;font-weight:900;border-radius:999px;padding:2px 8px}

/* one-screen home */
html.onescreen{height:100%;box-sizing:border-box}
html.onescreen body{height:100%}
html.onescreen #app{height:100%}
.wrap.home{height:100%;box-sizing:border-box;padding-block:10px;gap:10px;min-height:0}
.home .top,.home .tabs,.home .pstrip,.home #continue,.home .homefoot{flex:none}
.homeband{flex:0 1 auto;height:clamp(64px,15vh,150px);min-height:56px;position:relative}
.homeband svg{width:100%;height:100%}
.homeband h1{position:absolute;left:14px;bottom:8px;margin:0;font-size:clamp(1.25rem,4.5vh,2rem);color:var(--ink);background:color-mix(in srgb,var(--surface) 82%,transparent);padding:2px 12px;border-radius:12px}
.pstrip{display:flex;align-items:center;gap:10px;padding:6px 12px;background:var(--surface);border:1px solid var(--line);border-radius:16px}
.pstrip .turtle{width:46px;height:38px;flex:none}
.pmid{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;font-size:.88rem}
.pmid b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pmid .bar{height:8px}
.pstats{display:flex;gap:10px;font-size:.92rem;font-variant-numeric:tabular-nums}
.pstats .stat{gap:3px}
.pstats .spark-ic{width:16px;height:16px}
.pstats .stars{font-size:1rem}
.home #continue{justify-content:flex-start;min-height:46px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.home #continue .muted-on{opacity:.8;font-weight:600}
.pick{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:6px}
.pick h2{font-size:1.1rem;flex:none}
.gradegrid.fill{flex:1;min-height:0;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:10px}
.gradegrid.fill .gradecard{min-height:0;padding:0 0 8px;gap:1px}
.gradegrid.fill .gradecard svg{flex:1 1 0;min-height:24px;height:auto;margin-bottom:4px}
.gradegrid.fill .gradecard > span{padding-inline:10px}
.gradegrid.fill .gc-name{font-size:1.1rem}
.gradegrid.fill .gc-topic{font-size:.8rem;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.gradegrid.fill .gc-lights{font-size:.7rem;margin-top:2px}
.homefoot{display:flex;flex-wrap:wrap;align-items:center;gap:0 6px;margin:0}
.homefoot .btn{min-height:36px;padding:2px 6px;font-size:.85rem}
@media (min-width:760px){.gradegrid.fill .gc-topic{font-size:.9rem}.gradegrid.fill .gc-name{font-size:1.3rem}}
@media (max-height:600px){.homeband{display:none}.pick h2{display:none}}
@media (max-height:460px){.gradegrid.fill{grid-template-columns:repeat(6,minmax(0,1fr));grid-template-rows:minmax(0,1fr)}.gradegrid.fill .gc-topic{display:none}.pstrip .turtle{display:none}.homefoot{display:none}}
@media (max-width:520px){.homeband{height:clamp(56px,11vh,96px)}.gradegrid.fill .gc-topic{display:none}.gradegrid.fill{gap:8px}.gradegrid.fill .gc-name{font-size:1.05rem}.home{gap:8px}}

<body>
<div id="app"></div>
<div id="live" class="sr" aria-live="polite"></div>
<div id="toasts" class="toasts" aria-hidden="true"></div>
<script>
(function(){
'use strict';
/* ================= Constants ================= */
const KEY='scienceLagoon.game.power-the-island.v1';
const STEPS=['brief','predict','play','evidence','explain','transfer','summary'];
const STEP_LABEL={brief:'Brief',predict:'Predict',play:'Investigate',evidence:'Evidence',explain:'Explain',transfer:'New problem',summary:'Summary'};
const MAX_TRIALS=12;
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone=o=>JSON.parse(JSON.stringify(o));
const sameSet=(a,b)=>JSON.stringify(a)===JSON.stringify(b);

/* ================= Circuit model =================
   Terminals are nodes; conducting connectors, closed switches and bulb filaments are edges.
   Position on screen plays no part: a wire drawn across another is not joined to it. */
const CONDUCTS={metal:true,foil:true,clip:true,plastic:false,wood:false,string:false,rubber:false};
const MAT_NAME={metal:'metal wire',foil:'foil strip',clip:'steel paper clip',plastic:'plastic strip',wood:'wooden stick',string:'string',rubber:'rubber band'};
const matName=m=>m==null?'nothing (gap)':MAT_NAME[m]||'unknown part';
function runModel(L,set){
  const edges=[];
  for(const c of L.connectors){
    const m=set.connectors[c.id];
    if(m===null||m===undefined) continue;
    if(!(m in CONDUCTS)) return {status:'unavailable',reason:'unknown material'};
    if(CONDUCTS[m]) edges.push({u:c.a,v:c.b,bulb:null});
  }
  let src=null;
  for(const k of L.components){
    if(k.type==='battery'){src=k;continue;}
    if(k.type==='switch'){
      const st=set.switches[k.id];
      if(st!=='open'&&st!=='closed') return {status:'unavailable',reason:'unknown switch state'};
      if(st==='closed') edges.push({u:k.a,v:k.b,bulb:null});
    } else if(k.type==='bulb') edges.push({u:k.a,v:k.b,bulb:k.id});
    else return {status:'unavailable',reason:'unknown part'};
  }
  if(!src) return {status:'unavailable',reason:'no energy source'};
  const adj={};
  edges.forEach((e,i)=>{(adj[e.u]=adj[e.u]||[]).push(i);(adj[e.v]=adj[e.v]||[]).push(i);});
  const paths=[],seen=new Set([src.p]),used=[];
  (function dfs(node){
    if(node===src.n){paths.push(used.slice());return;}
    for(const i of adj[node]||[]){
      const e=edges[i],nx=e.u===node?e.v:e.u;
      if(seen.has(nx)) continue;
      seen.add(nx);used.push(i);dfs(nx);used.pop();seen.delete(nx);
    }
  })(src.p);
  if(paths.some(p=>!p.some(i=>edges[i].bulb))) return {status:'unsupported',reason:'short-circuit layout'};
  if(paths.length>1) return {status:'unsupported',reason:'parallel network'};
  const lit={};
  L.components.filter(k=>k.type==='bulb').forEach(b=>lit[b.id]=false);
  if(paths.length===1) paths[0].forEach(i=>{if(edges[i].bulb) lit[edges[i].bulb]=true;});
  return {status:'ok',closed:paths.length===1,lit};
}

/* ================= Solar model =================
   Idealised example rules, not measurements: a panel in open sun by day makes enough electricity
   for the lamp and fully charges a battery store; shade gives too little; a panel makes nothing after dark. */
const SOLAR_KEYS={panel:['yes','no'],site:['sun','shade'],storage:['yes','no'],time:['day','night']};
const SOLAR_LABEL={panel:'Solar panel',site:'Panel spot',storage:'Battery store',time:'Time'};
const SOLAR_VAL={panel:{yes:'fitted',no:'none'},site:{sun:'open sun',shade:'under the palm (shade)'},storage:{yes:'fitted',no:'none'},time:{day:'daytime',night:'after dark'}};
function runSolar(s){
  for(const k in SOLAR_KEYS) if(!SOLAR_KEYS[k].includes(s[k])) return {status:'unavailable',reason:'unknown setting'};
  const generating=s.panel==='yes'&&s.site==='sun'&&s.time==='day';
  const charged=s.storage==='yes'&&s.panel==='yes'&&s.site==='sun';
  return {status:'ok',generating,charged,lit:s.time==='day'?(generating||charged):charged};
}

/* ================= Layouts ================= */
function comp(id,type,ori,cx,cy,name){
  const k={id,type,ori,cx,cy,name};
  if(type==='battery'){k.p=id+'.p';k.n=id+'.n';} else {k.a=id+'.a';k.b=id+'.b';}
  return k;
}
const LAYOUTS={
  path:{id:'path',title:'Path light',viewBox:'0 0 400 260',
    components:[comp('bat','battery','v',60,130,'Battery'),comp('sw','switch','h',200,40,'Switch'),comp('bulb','bulb','v',340,130,'Bulb')],
    connectors:[
      {id:'w1',a:'bat.p',b:'sw.a',d:'M60 100 V40 H170',lab:[115,28],name:'Battery + to switch'},
      {id:'w2',a:'sw.b',b:'bulb.a',d:'M230 40 H340 V100',lab:[285,28],name:'Switch to bulb'},
      {id:'w3',a:'bulb.b',b:'bat.n',d:'M340 160 V222 H60 V160',lab:[200,244],name:'Bulb back to battery −'}],
    path:['start','w1','sw','w2','bulb','w3','end']},
  class:{id:'class',title:'Classroom lamp',viewBox:'0 0 400 260',
    components:[comp('bat','battery','h',200,220,'Battery'),comp('bulb','bulb','h',90,60,'Lamp'),comp('sw','switch','v',340,120,'Switch')],
    connectors:[
      {id:'c1',a:'bat.p',b:'bulb.a',d:'M170 220 H30 V60 H60',lab:[30,150],name:'Battery + to lamp'},
      {id:'c2',a:'bulb.b',b:'sw.a',d:'M120 60 H340 V90',lab:[200,47],name:'Lamp to switch'},
      {id:'c3',a:'sw.b',b:'bat.n',d:'M340 150 V220 H230',lab:[290,242],name:'Switch back to battery −'}],
    loose:{id:'loose',d:'M272 22 V112',ends:[[272,22],[272,112]],lab:[272,13],name:'Loose wire'},
    path:['start','c1','bulb','c2','sw','c3','end']},
  series:{id:'series',title:'Two-bulb noticeboard light',viewBox:'0 0 400 290',
    components:[comp('bat','battery','v',60,130,'Battery'),comp('sw','switch','h',200,40,'Switch'),comp('b1','bulb','v',340,130,'Bulb 1'),comp('b2','bulb','h',200,222,'Bulb 2')],
    connectors:[
      {id:'s1',a:'bat.p',b:'sw.a',d:'M60 100 V40 H170',lab:[115,28],name:'Battery + to switch'},
      {id:'s2',a:'sw.b',b:'b1.a',d:'M230 40 H340 V100',lab:[285,28],name:'Switch to bulb 1'},
      {id:'s3',a:'b1.b',b:'b2.b',d:'M340 160 V222 H230',lab:[296,210],name:'Bulb 1 to bulb 2'},
      {id:'s4',a:'b2.a',b:'bat.n',d:'M170 222 H60 V160',lab:[110,210],name:'Bulb 2 back to battery −'}],
    path:['start','s1','sw','s2','b1','s3','b2','s4','end']},
  room:{id:'room',components:[comp('bat','battery','v',0,0,'Battery'),comp('sw','switch','h',0,0,'Wall switch'),comp('lamp','bulb','v',0,0,'Device')],
    connectors:[{id:'r1',a:'bat.p',b:'sw.a'},{id:'r2',a:'sw.b',b:'lamp.a'},{id:'r3',a:'lamp.b',b:'bat.n'}]}
};
const deviceOn=sw=>{const r=runModel(LAYOUTS.room,{connectors:{r1:'metal',r2:'metal',r3:'metal'},switches:{sw}});return r.status==='ok'&&r.lit.lamp;};
function termPos(k,which){
  const {cx,cy,ori}=k;
  if(ori==='v') return which==='p'||which==='a'?[cx,cy-30]:[cx,cy+30];
  return which==='p'||which==='a'?[cx-30,cy]:[cx+30,cy];
}

/* ================= Pictures =================
   One small symbol library; every card also carries a text label. */
const rays=(cx,cy,r1,r2,n)=>Array.from({length:n||8},(_,i)=>{const a=2*Math.PI*i/(n||8);return `<line class="ray" x1="${(cx+r1*Math.cos(a)).toFixed(1)}" y1="${(cy+r1*Math.sin(a)).toFixed(1)}" x2="${(cx+r2*Math.cos(a)).toFixed(1)}" y2="${(cy+r2*Math.sin(a)).toFixed(1)}"/>`;}).join('');
const SV=b=>`<svg viewBox="0 0 100 100" aria-hidden="true">${b}</svg>`;
const STROKE='style="stroke:var(--ink);stroke-width:3"';
function switchPic(on){
  return SV(`<rect class="sc-surface" x="28" y="10" width="44" height="80" rx="10" ${STROKE}/><rect class="${on?'sc-lagoon':'sc-ink'}" x="38" y="${on?20:50}" width="24" height="30" rx="6"/><text x="50" y="${on?66:40}" text-anchor="middle" class="lbl-strong">${on?'ON':'OFF'}</text>`);
}
const PIC={
  lampOn:()=>SV(`<g class="lit">${rays(50,56,30,42)}<path class="sc-lagoon" d="M30 40 L70 40 L62 22 L38 22Z"/><circle class="glass" cx="50" cy="56" r="17"/></g>`),
  lampOff:()=>SV(`<path class="sc-lagoon" d="M30 40 L70 40 L62 22 L38 22Z"/><circle class="glass" cx="50" cy="56" r="17"/><path class="sc-line" d="M42 56 h16"/>`),
  fan:()=>SV(`<circle class="glass" cx="50" cy="44" r="30"/><g class="sc-lagoon"><ellipse cx="50" cy="29" rx="7" ry="14"/><ellipse cx="63" cy="52" rx="7" ry="14" transform="rotate(120 63 52)"/><ellipse cx="37" cy="52" rx="7" ry="14" transform="rotate(240 37 52)"/></g><circle class="sc-ink" cx="50" cy="44" r="4"/><path class="sc-line" d="M50 74 V90 M36 92 H64"/>`),
  fanOn:()=>SV(`<circle class="glass" cx="50" cy="44" r="30"/><g class="sc-lagoon"><ellipse cx="50" cy="29" rx="7" ry="14"/><ellipse cx="63" cy="52" rx="7" ry="14" transform="rotate(120 63 52)"/><ellipse cx="37" cy="52" rx="7" ry="14" transform="rotate(240 37 52)"/></g><circle class="sc-ink" cx="50" cy="44" r="4"/><path class="sc-line" d="M50 74 V90 M36 92 H64 M86 30 q6 14 0 28 M92 24 q9 20 0 40"/>`),
  switchOn:()=>switchPic(true), switchOff:()=>switchPic(false),
  hands:()=>SV(`<g class="sc-sand"><rect x="24" y="30" width="22" height="46" rx="11" transform="rotate(-14 35 53)" ${STROKE}/><rect x="54" y="30" width="22" height="46" rx="11" transform="rotate(14 65 53)" ${STROKE}/></g>`),
  sun:()=>SV(`<g class="lit">${rays(50,50,26,40)}<circle class="sc-sun" cx="50" cy="50" r="19"/></g>`),
  moon:()=>SV(`<rect class="sc-night" x="8" y="8" width="84" height="84" rx="16"/><path class="sc-moon" d="M58 22 a28 28 0 1 0 16 46 a22 22 0 1 1 -16 -46Z"/>`),
  torch:()=>SV(`<rect class="sc-lagoon" x="14" y="40" width="44" height="22" rx="5" ${STROKE}/><path class="sc-surface" d="M58 36 L76 28 L76 74 L58 66Z" ${STROKE}/><rect class="sc-ink" x="28" y="34" width="10" height="6" rx="2"/>`),
  torchOn:()=>SV(`<path class="glow" d="M76 28 L98 12 L98 90 L76 74Z"/><rect class="sc-lagoon" x="10" y="40" width="44" height="22" rx="5" ${STROKE}/><path class="sc-sun" d="M54 36 L76 28 L76 74 L54 66Z" ${STROKE}/>`),
  radio:()=>SV(`<rect class="sc-lagoon" x="14" y="34" width="72" height="46" rx="8" ${STROKE}/><circle class="sc-surface" cx="36" cy="57" r="13" ${STROKE}/><path class="sc-line" d="M60 50 h16 M60 60 h16 M30 34 L64 14"/>`),
  broom:()=>SV(`<path class="sc-line" d="M62 8 L46 60"/><path class="sc-sand" d="M30 56 L62 64 L56 92 L18 84Z" ${STROKE}/>`),
  handfan:()=>SV(`<path class="sc-coral" d="M50 74 L14 34 A50 50 0 0 1 86 34Z" ${STROKE}/><path class="sc-line" d="M50 74 L50 26 M50 74 L30 30 M50 74 L70 30 M50 74 V94"/>`),
  pencil:()=>SV(`<path class="sc-sun" d="M20 70 L66 24 L78 36 L32 82Z" ${STROKE}/><path class="sc-sand" d="M20 70 L32 82 L14 88Z" ${STROKE}/>`),
  scissors:()=>SV(`<circle class="sc-surface" cx="28" cy="72" r="11" ${STROKE}/><circle class="sc-surface" cx="52" cy="80" r="11" ${STROKE}/><path class="sc-line" d="M34 63 L82 16 M48 70 L66 20"/>`),
  candle:()=>SV(`<rect class="sc-paper" x="38" y="44" width="24" height="44" rx="3" ${STROKE}/><path class="sc-sun" d="M50 12 C60 26 60 36 50 40 C40 36 40 26 50 12Z"/><path class="sc-line" d="M50 40 V44"/>`),
  mirror:()=>SV(`<ellipse class="sc-sky" cx="50" cy="44" rx="26" ry="32" ${STROKE}/><path style="stroke:var(--surface);stroke-width:4;fill:none" d="M36 32 L46 22 M38 46 L58 26"/><path class="sc-line" d="M50 76 V94"/>`),
  book:()=>SV(`<path class="sc-lagoon" d="M14 24 L48 30 L48 84 L14 78Z" ${STROKE}/><path class="sc-coral" d="M86 24 L52 30 L52 84 L86 78Z" ${STROKE}/>`),
  spoon:()=>SV(`<ellipse class="sc-sky" cx="50" cy="30" rx="16" ry="22" ${STROKE}/><path class="sc-line" d="M50 52 V94"/>`),
  eye:()=>SV(`<path class="sc-surface" d="M8 50 Q50 10 92 50 Q50 90 8 50Z" ${STROKE}/><circle class="sc-lagoon" cx="50" cy="50" r="15"/><circle class="sc-ink" cx="50" cy="50" r="6"/>`),
  cable:()=>SV(`<path style="fill:none;stroke:var(--ink);stroke-width:8;stroke-linecap:round" d="M8 70 Q30 50 44 58"/><path style="fill:none;stroke:var(--ink);stroke-width:8;stroke-linecap:round" d="M56 58 Q72 66 92 40"/><path style="stroke:var(--coral);stroke-width:3;fill:none" d="M46 48 l4 -10 l4 10 M44 70 l6 8 l6 -8"/><text x="50" y="26" text-anchor="middle" class="lbl-gap">!</text>`),
  adult:()=>SV(`<circle class="sc-sand" cx="36" cy="26" r="12" ${STROKE}/><path class="sc-lagoon" d="M20 92 V54 a16 16 0 0 1 32 0 V92Z" ${STROKE}/><circle class="sc-sand" cx="72" cy="50" r="8" ${STROKE}/><path class="sc-coral" d="M62 92 V72 a10 10 0 0 1 20 0 V92Z" ${STROKE}/>`),
  stop:()=>SV(`<path class="sc-coral" d="M34 10 H66 L90 34 V66 L66 90 H34 L10 66 V34Z"/><path style="stroke:var(--surface);stroke-width:8;stroke-linecap:round" d="M32 50 H68"/>`),
  bell:()=>SV(`<path class="sc-sun" d="M24 70 C24 40 32 24 50 24 C68 24 76 40 76 70Z" ${STROKE}/><path class="sc-line" d="M18 72 H82 M50 14 V24"/><circle class="sc-ink" cx="50" cy="80" r="6"/>`),
  toycar:()=>SV(`<path class="sc-coral" d="M10 66 V50 L28 50 L38 34 H66 L78 50 H90 V66Z" ${STROKE}/><circle class="sc-ink" cx="30" cy="70" r="9"/><circle class="sc-ink" cx="72" cy="70" r="9"/>`),
  tv:()=>SV(`<rect class="sc-window" x="12" y="18" width="76" height="52" rx="6" ${STROKE}/><path class="sc-line" d="M40 84 H60 M50 70 V84"/>`),
  window:()=>SV(`<rect class="sc-sky" x="18" y="12" width="64" height="76" rx="4" ${STROKE}/><path class="sc-line" d="M50 12 V88 M18 50 H82"/><circle class="sc-sun" cx="36" cy="30" r="8"/>`),

function solarScene(s,res){

  const wire=s.panel==='yes'?`<path style="fill:none;stroke:var(--copper);stroke-width:3" d="M${px} 160 V172 H${s.storage==='yes'?282:330} ${s.storage==='yes'?'M318 160 H330 V':'V'}150"/>`:'';

  return `<svg viewBox="0 0 400 200" role="img" aria-label="Solar path light model. ${night?'After dark':'Daytime'}. Panel ${SOLAR_VAL.panel[s.panel]}${s.panel==='yes'?' in '+SOLAR_VAL.site[s.site]:''}. Battery store ${SOLAR_VAL.storage[s.storage]}. Lamp ${status}.">

  <path d="M150 70 Q200 40 250 70 L262 168 H138Z" style="fill:var(--ink);opacity:.12"/>
  ${panel}${wire}${store}
  <g transform="translate(330 70)">${lit?'<circle class="glow" cx="0" cy="12" r="34"/>':''}<rect class="sc-ink" x="-3" y="12" width="6" height="80"/><path class="sc-lagoon" d="M-16 10 h32 l-7 -16 h-18Z"/><g class="${lit?'lit':''}">${lit?rays(0,18,12,20):''}<circle class="glass" cx="0" cy="18" r="8"/></g></g>
  <text x="330" y="190" text-anchor="middle" class="lbl-strong">lamp ${status}</text></svg>`;
}
function sceneHTML(key){
  if(key==='classroom') return classroomScene(false);
  if(key==='classroomLit') return classroomScene(true);
  if(key==='path') return pathScene(false);
  if(key==='pathLit') return pathScene(true);

  return islandBand();
}

const O=a=>({id:a[0],label:a[1],ok:!!a[2],fb:a[3]||'',pic:a[4]});
const cond=v=>v!=null&&CONDUCTS[v]===true;
const isClosed=s=>s.switches.sw==='closed';
const allOn=r=>r.status==='ok'&&Object.values(r.lit).every(Boolean);
const allOff=r=>r.status==='ok'&&Object.values(r.lit).every(v=>!v);
const has=f=>T=>T.some(x=>f(x.s,x.r,x));
const vals=s=>Object.values(s.connectors);
function onlyDiffer(a,b,key){
  if(!sameSet(a.switches,b.switches)) return false;
  for(const k in a.connectors) if(k!==key&&a.connectors[k]!==b.connectors[k]) return false;
  return a.connectors[key]!==b.connectors[key];
}
function oneGapIn(s,ids){const g=Object.keys(s.connectors).filter(k=>s.connectors[k]==null);return g.length===1&&ids.includes(g[0])&&vals(s).filter(v=>v!=null).every(v=>v==='metal');}

const MISSIONS={};
const normSet=x=>x&&x.c?{connectors:clone(x.c),switches:{sw:x.sw||'closed'}}:x;
function mk(g,n,o){
  const id=`power-g${g}-${String(n).padStart(2,'0')}`;
  const p=clone(o.play);
  if(p.engine==='circuit') p.initial=normSet(o.play.initial);
  p.reqs=o.play.reqs; p.steps=o.play.steps;
  const fig=o.transfer.fig?Object.assign({},o.transfer.fig):null;
  if(fig&&fig.type==='circuit') fig.set=normSet(fig.set);
  MISSIONS[id]={id,grade:g,number:n,version:o.version||'1.0.0',title:o.t,concept:o.concept,goal:o.goal,scene:o.scene||'island',
    brief:o.brief,play:p,learned:o.learned,hints:o.hints,
    predict:{q:o.predict.q,options:o.predict.o.map(a=>({id:a[0],label:a[1],pic:a[2]})),reasons:(o.predict.r||[]).map(a=>({id:a[0],label:a[1]}))},
    explain:o.explain.map(q=>({q:q.q,options:q.o.map(O)})),
    transfer:{intro:o.transfer.intro,fig,qs:o.transfer.qs.map(q=>({q:q.q,tap:!!q.tap,options:q.o.map(O)}))}};
}

mk(5,3,{t:'A fair circuit comparison',concept:'Controlling variables',goal:'Compare connector materials, changing only one thing.',
  brief:'Is foil as good as metal wire? Is wood? Plan a fair comparison.',
  predict:{q:'To test the material fairly, what should you change?',o:[['one','Only the material'],['many','The material and the switch']]},
  play:{engine:'circuit',layout:'path',initial:{c:{w1:'metal',w2:'metal',w3:'metal'},sw:'closed'},edit:['w3'],mats:['metal','foil','wood','plastic'],
    reqs:[['Test with a conductor in the test connector.',has((s,r)=>isClosed(s)&&cond(s.connectors.w3)&&allOn(r))],
      ['Run a fair pair: change only the test connector’s material and test again.',T=>T.some(a=>T.some(b=>a!==b&&onlyDiffer(a.s,b.s,'w3')&&a.s.connectors.w3!=null&&b.s.connectors.w3!=null&&allOn(a.r)&&allOff(b.r)))]],
    steps:['Test with a conductor in the test connector (bulb back to battery).','Now change only that material to one you think won’t conduct, and test.']},
  explain:[{q:'Why is your pair a fair test?',o:[['one','Only the connector material changed; battery, bulb, other wires and switch stayed the same',1,'Yes. So the material caused the difference.'],['many','Lots of things changed',0,'Look at your test log.'],['luck','It was lucky',0,'What stayed the same?']]},
    {q:'What can you conclude?',o:[['material','The material in that connector decided whether the bulb lit.',1,'Yes. That’s a conclusion your evidence supports.'],['bright','Foil makes the bulb brighter than wire.',0,'Brightness wasn’t measured.'],['all','All materials behave the same.',0,'Look at your pair.']]}],
  transfer:{intro:'A classmate’s test.',fig:{type:'scene',key:'island'},qs:[{q:'A classmate swapped the battery AND the connector at the same time. What’s the problem?',o:[['two','Two things changed, so we can’t tell which caused the result',1,'Yes.'],['fine','Nothing; it’s fair',0,'How many things changed?'],['slow','It took too long',0,'Think about fairness.']]}]},
  hints:{play:['Only use the test connector.','Keep the switch and other wires the same.','Worked comparison: metal → on; then plastic in the same spot → off.'],explain:['Look at your two tests.','What changed between them?'],transfer:['Count the changes.','Fair tests change one thing.']},

  transfer:{intro:'A heater.',fig:{type:'scene',key:'island'},qs:[{q:'For a room heater, the heat is…',o:[['useful','Useful',1,'Yes. Useful depends on the device’s job.'],['wasted','Wasted',0,'What is a heater’s job?']]}]},
  hints:{play:['Ask: what is this device’s job?','Outputs that don’t help the job are wasted.','Worked example: lamp light → useful; lamp heat → wasted.'],explain:['Which output is wasted in a lamp?','LEDs waste less.'],transfer:['What is a heater for?','Heat is its job.']},
  learned:'Whether an output is useful depends on the device’s job. Efficient devices waste less energy.'});

mk(5,6,{t:'Stored or transferring',concept:'Energy stores and transfers',goal:'Sort examples into energy stores and energy being transferred.',

  predict:{q:'Is a charged battery storing energy?',o:[['store','Storing'],['transfer','Transferring']]},
  play:{engine:'sort',instr:'Stored or being transferred?',bins:[['store','Energy stored'],['transfer','Energy being transferred']],
    items:[['battery','A charged battery in a drawer','store','Its energy is stored chemically.'],['food','Food in your lunchbox','store','It stores chemical energy.'],['fuel','Fuel in a boat tank','store','It stores chemical energy.'],['bank','A charged power bank','store','Stored for later.'],['bulb','A glowing bulb','transfer','Energy is leaving as light and heat.'],['fan','A spinning fan','transfer','Energy is moving the air.'],['loop','A closed circuit lighting a lamp','transfer','Energy is carried to the lamp.']]},
  explain:[{q:'When a torch is switched on, what happens to the battery’s energy?',o:[['transfer','It is transferred through the circuit to the bulb',1,'Yes. Stored energy becomes energy on the move.'],['make','The battery makes new energy',0,'Does a battery create energy?'],['stay','It stays in the battery',0,'Then how does the bulb light?']]}],
  transfer:{intro:'At the beach.',fig:{type:'solar',set:{panel:'yes',site:'sun',storage:'yes',time:'day'}},qs:[{q:'A solar battery store has been charged all day and nothing is switched on. Its energy is…',o:[['store','Stored',1,'Yes. Ready for later.'],['transfer','Being transferred to the lamp',0,'Is the lamp on?'],['gone','Gone',0,'Charging fills a store.']]}]},

  brief:'This light has a panel and a battery store. Does it matter where the panel is if the light is only used at night?',
  predict:{q:'If the panel is in shade, will the lamp still work at night?',o:[['yes','Yes, the store will help'],['no','No']],r:[['store','There is a battery store'],['charge','The store needs charging by day'],['unsure','I’m not sure']]},
  play:{engine:'solar',initial:{panel:'yes',site:'sun',storage:'yes',time:'night'},edit:['site','time'],
    reqs:[['Test at night with the panel in open sun.',has((s,r)=>s.time==='night'&&s.site==='sun'&&r.lit)],['Test at night with the panel in shade.',has((s,r)=>s.time==='night'&&s.site==='shade'&&!r.lit)]],
    steps:['Test at night with the panel in open sun.','Move the panel into shade and test at night.']},
  explain:[{q:'Why did the shaded system fail at night?',o:[['charge','The shaded panel couldn’t charge the store during the day',1,'Yes. A store only holds what was put into it.'],['night','Stores don’t work at night',0,'Look at your sunny-spot night test.'],['lamp','The lamp broke',0,'It lit in the other test.']]},
    {q:'Did any result surprise you?',o:[['yes','Yes, the store didn’t help when the panel was shaded',1,'Good. Results that challenge a prediction are useful evidence.'],['no','No, it was obvious',0,'Look at your prediction too.']]}],
  transfer:{intro:'A school entrance light.',fig:{type:'solar',set:{panel:'yes',site:'shade',storage:'yes',time:'night'}},qs:[{q:'This light has a store but its panel is under a tree. What would fix it?',o:[['move','Move the panel into open sun',1,'Yes. The store needs charging.'],['store','Add a second store',0,'Would an empty store help?'],['lamp','Change the lamp',0,'Is the lamp the problem?']]}]},
  hints:{play:['Change only the panel spot.','Keep the time at night.','Worked comparison: sun + store → on at night. Shade + store → off.'],explain:['Where does the store’s energy come from?','From the panel by day.'],transfer:['Is the panel in sun?','Move it.']},

mk(5,9,{t:'Observation or interpretation',concept:'Separating results from conclusions',goal:'Sort statements into observations and interpretations.',
  brief:'Scientists separate what they saw from what they think it means.',
  predict:{q:'“The bulb was off in Test 2.” Is that an observation?',o:[['obs','Observation'],['int','Interpretation']]},
  play:{engine:'sort',instr:'Observation or interpretation?',bins:[['obs','Observation (what we saw)'],['int','Interpretation (what we think it means)']],
    items:[['off','The bulb was off in Test 2.','obs','It describes what was seen.'],['on','The bulb was on when foil was used.','obs','It describes what was seen.'],['switch','The switch was closed in every test.','obs','It describes a setting.'],['plastic','Plastic doesn’t conduct.','int','It explains the results.'],['gap','The gap stopped the current.','int','It explains a result.'],['metal','Metals are good conductors.','int','It is a general idea from the results.']]},
  explain:[{q:'Why keep them separate?',o:[['check','So others can check whether the conclusion fits the results',1,'Yes.'],['neat','It looks neater',0,'Think about checking.'],['same','They are the same thing',0,'Look at your two groups.']]}],
  transfer:{intro:'A solar report.',fig:{type:'solar',set:{panel:'yes',site:'shade',storage:'no',time:'day'}},qs:[{q:'Which is an observation?',o:[['obs','The lamp was off with the panel under the palm.',1,'Yes. That is what was seen.'],['int','Shade reduces the panel’s output.',0,'That explains the result.'],['int2','Panels need sunlight.',0,'That is an interpretation.']]}]},

  learned:'Observations describe what was seen. Interpretations explain what it means. Keeping them separate lets others check.'});

mk(5,10,{t:'Batteries don’t make energy',concept:'Energy and current misconceptions',goal:'Decide which statements about batteries and current are accurate.',
  brief:'Lots of people mix up energy and current. Sort the statements.',
  predict:{q:'Does a battery contain a packet of current that gets used up?',o:[['yes','Yes'],['no','No']]},
  play:{engine:'sort',instr:'Accurate or not accurate?',bins:[['true','Accurate'],['false','Not accurate']],
    items:[['stores','A battery stores energy chemically.','true','Yes, as a chemical store.'],['transfers','Energy is transferred from the battery to the bulb.','true','Through the circuit.'],['create','A battery creates energy from nothing.','false','Energy is stored, not created.'],['usedup','The bulb uses up the current.','false','Current is the same all around a single loop.'],['flat','A “flat” battery has transferred its stored energy.','true','Its store is empty.'],['packet','A battery holds a packet of current.','false','It stores energy; current is the flow in the loop.']]},
  explain:[{q:'When a battery goes “flat”, what has happened?',o:[['energy','Its stored energy has been transferred',1,'Yes.'],['current','It has run out of current',0,'Current flows; energy is stored.'],['destroy','Its energy was destroyed',0,'Energy isn’t destroyed.']]}],
  transfer:{intro:'A note on the noticeboard.',fig:{type:'scene',key:'path'},qs:[{q:'The note says: “The second bulb gets less current because the first bulb used some.” Is that accurate?',o:[['no','No. In one loop the current is the same all the way round.',1,'Yes.'],['yes','Yes',0,'Look at your “uses up current” card.']]}]},

  learned:'Batteries store energy and transfer it through a circuit. They don’t create energy, and current isn’t used up by bulbs.'});

mk(6,1,{t:'Two bulbs one loop',concept:'Series circuits',goal:'Complete a single loop that passes through two identical bulbs.',
  brief:'The noticeboard light has two identical bulbs in one loop. One wire is missing.',
  predict:{q:'With one wire missing, will either bulb light?',o:[['none','Neither'],['one','Just one'],['both','Both']],r:[['loop','The loop is broken'],['near','The nearest bulb gets current first'],['unsure','I’m not sure']]},
  play:{engine:'circuit',layout:'series',initial:{c:{s1:'metal',s2:'metal',s3:'metal',s4:null},sw:'closed'},mats:['metal'],
    reqs:[['Test as you found it.',has((s,r)=>s.connectors.s4==null&&allOff(r))],['Complete the loop and test.',has((s,r)=>isClosed(s)&&allOn(r))]],
    steps:['Test the circuit as you found it.','Add the missing wire and test.']},
  explain:[{q:'Trace the route. Which statement is correct?',o:[['route','Current flows from the battery, through the switch, bulb 1, bulb 2, and back, all in one loop.',1,'Yes. One route, both bulbs on it.'],['usedup','Bulb 1 uses up current so less reaches bulb 2.',0,'Current isn’t used up in a series loop.'],['two','Each bulb has its own separate loop.',0,'Trace your route. Is there more than one?']]},
    {q:'Why was bulb 1 off when the gap was after bulb 2?',o:[['loop','A gap anywhere breaks the single loop',1,'Yes.'],['far','The gap was far away so it didn’t matter',0,'Look at your first test.'],['order','Bulb 1 waits for bulb 2',0,'Bulbs don’t wait.']]}],
  transfer:{intro:'A new two-bulb loop.',fig:{type:'circuit',layout:'series',set:{c:{s1:'metal',s2:null,s3:'metal',s4:'metal'},sw:'closed'}},qs:[{q:'The gap is between the switch and bulb 1. What happens to bulb 2?',o:[['off','It is off too',1,'Yes. One loop, one break.'],['on','It lights',0,'Is the loop complete?']]}]},
  hints:{play:['Test first.','Find the missing wire.','Worked comparison: all four wires + closed switch → both on.'],explain:['Trace the loop with your finger.','Is there one route or two?'],transfer:['One loop?','A break anywhere stops it.']},
  learned:'In a series circuit there is one loop. Current flows through every part and isn’t used up.'});

mk(6,2,{t:'Break anywhere',concept:'Predicting series faults',goal:'Open the loop before, between and after the bulbs, and predict each result.',
  brief:'Where you break a series loop might seem to matter. Test it.',
  predict:{q:'If you break the loop between the bulbs, what happens?',o:[['both','Both bulbs go off'],['one','Only bulb 2 goes off'],['none','Both stay on']],r:[['loop','It is one loop'],['first','Bulb 1 is before the break'],['unsure','I’m not sure']]},
  play:{engine:'circuit',layout:'series',initial:{c:{s1:'metal',s2:'metal',s3:'metal',s4:'metal'},sw:'closed'},mats:['metal'],allowGap:true,lockSwitch:true,
    reqs:[['Break the loop before the bulbs and test.',has((s,r)=>oneGapIn(s,['s1','s2'])&&allOff(r))],['Break it between the bulbs and test.',has((s,r)=>oneGapIn(s,['s3'])&&allOff(r))],['Break it after the bulbs and test.',has((s,r)=>oneGapIn(s,['s4'])&&allOff(r))]],
    steps:['Remove one wire before bulb 1 and test. Put it back after.','Remove only the wire between the bulbs and test.','Remove only the wire after bulb 2 and test.']},
  explain:[{q:'What do all three tests show?',o:[['all','A single break anywhere turns both bulbs off',1,'Yes. Position doesn’t matter in one loop.'],['near','Only the bulb nearest the break goes off',0,'Look at your test log.'],['before','Breaks before the bulbs matter most',0,'Compare all three.']]},
    {q:'What does that tell you about current?',o:[['loop','It needs the whole loop; it doesn’t flow “up to” the break',1,'Yes.'],['usedup','It gets used up before the break',0,'Then bulb 1 would stay on.'],['fast','It flows too fast to see',0,'Look at the results.']]}],
  transfer:{intro:'Festival lights.',fig:{type:'scene',key:'pathLit'},qs:[{q:'A string of lights is wired in one loop. One connection breaks near the end. What happens?',o:[['all','All the lights go off',1,'Yes. Same idea.'],['end','Only the last light goes off',0,'Is it one loop?'],['none','Nothing',0,'Is the loop complete?']]}]},
  hints:{play:['Tap a wire and choose “Remove it”.','Put it back before removing the next one.','Worked comparison: any single gap → both bulbs off.'],explain:['Compare your three tests.','Did position matter?'],transfer:['Is it one loop?','Any break stops all.']},
  learned:'In a single series loop, a break anywhere stops the current everywhere, so all the bulbs go off.'});

  transfer:{intro:'A new site: the jetty.',fig:{type:'solar',set:{panel:'yes',site:'shade',storage:'yes',time:'night'}},qs:[{q:'This design has a store, but the panel is shaded. What would you change first?',o:[['move','Move the panel into open sun',1,'Yes. The store needs charging.'],['remove','Remove the store',0,'Then what lights it at night?'],['bulb','Add another lamp',0,'Would that help charging?']]},
    {q:'Why is “it will work every night” too strong a claim?',o:[['limits','Charging depends on weather and the model is simplified',1,'Yes. State the limit.'],['fine','It isn’t too strong',0,'Think about cloudy weeks.']]}]},

mk(6,4,{t:'Find the series fault',concept:'Diagnosing a series circuit',goal:'Find a hidden fault in a two-bulb loop.',
  brief:'Both bulbs on the noticeboard are off. The switch is closed. Find the fault.',
  predict:{q:'If both bulbs are off, where might the fault be?',o:[['any','Anywhere in the loop'],['bulb','In a bulb']]},

/* ================= Circuit drawing ================= */
function circuitSVG(L,set,o){
  o=o||{};
  const hl=o.hl||[], h=+L.viewBox.split(' ')[3];
  let s=`<svg viewBox="${L.viewBox}" role="img" aria-label="${esc(o.alt||describeCircuit(L,set,o.lit))}"><rect class="board" width="400" height="${h}"/>`;
  for(const c of L.connectors) if(hl.includes(c.id)) s+=`<path class="hl" d="${c.d}"/>`;
  if(L.loose&&hl.includes('loose')) s+=`<path class="hl" d="${L.loose.d}"/>`;
  for(const k of L.components) if(hl.includes(k.id)) s+=`<circle class="hl-c" cx="${k.cx}" cy="${k.cy}" r="36"/>`;
  for(const c of L.connectors){
    const m=set.connectors[c.id], act=o.act?`data-action="${o.act}" data-id="${c.id}"`:'';
    s+=`<g ${act}><path class="hit" d="${c.d}"/>`;
    if(m==null) s+=`<path class="w-gap" d="${c.d}"/><text class="lbl-gap" x="${c.lab[0]}" y="${c.lab[1]}" text-anchor="middle">✕ gap</text>`;
    else if(cond(m)) s+=`<path class="w-metal" d="${c.d}"/>${m!=='metal'?`<text class="lbl-plastic" x="${c.lab[0]}" y="${c.lab[1]}" text-anchor="middle">${esc(MAT_NAME[m])}</text>`:''}`;
    else s+=`<path class="w-plastic" d="${c.d}"/><path class="w-plastic-dash" d="${c.d}"/><text class="lbl-plastic" x="${c.lab[0]}" y="${c.lab[1]}" text-anchor="middle">${esc(MAT_NAME[m]||'?')}</text>`;
    s+=`</g>`;
  }
  if(L.loose){
    const lw=L.loose, act=o.act?`data-action="${o.act}" data-id="loose"`:'';
    s+=`<g ${act}><path class="hit" d="${lw.d}"/><path class="w-loose" d="${lw.d}"/>${lw.ends.map(e=>`<circle class="term" cx="${e[0]}" cy="${e[1]}" r="5"/>`).join('')}<text class="lbl" x="${lw.lab[0]}" y="${lw.lab[1]}" text-anchor="middle">loose wire</text></g>`;
  }
  for(const k of L.components){
    const act=o.act?`data-action="${o.act}" data-id="${k.id}"`:'';
    s+=`<g ${act}><circle class="hit-c" cx="${k.cx}" cy="${k.cy}" r="32"/>${drawComp(k,set,o)}</g>`;
  }
  for(const k of L.components) for(const w of (k.type==='battery'?['p','n']:['a','b'])){const [x,y]=termPos(k,w);s+=`<circle class="term" cx="${x}" cy="${y}" r="5"/>`;}
  return s+'</svg>';
}
function drawComp(k,set,o){
  const {cx,cy,ori}=k; let s='';
  if(k.type==='battery'){
    if(ori==='v') s+=`<path class="sym" d="M${cx} ${cy-30} V${cy-8} M${cx-20} ${cy-8} H${cx+20} M${cx} ${cy+8} V${cy+30}"/><path class="sym" style="stroke-width:6" d="M${cx-10} ${cy+8} H${cx+10}"/><text class="lbl-strong" x="${cx-28}" y="${cy-12}" text-anchor="middle">+</text><text class="lbl-strong" x="${cx-28}" y="${cy+22}" text-anchor="middle">−</text><text class="lbl" x="${cx+48}" y="${cy+4}" text-anchor="middle">battery</text>`;
    else s+=`<path class="sym" d="M${cx-30} ${cy} H${cx-8} M${cx-8} ${cy-20} V${cy+20} M${cx+8} ${cy} H${cx+30}"/><path class="sym" style="stroke-width:6" d="M${cx+8} ${cy-10} V${cy+10}"/><text class="lbl-strong" x="${cx-20}" y="${cy-24}" text-anchor="middle">+</text><text class="lbl-strong" x="${cx+20}" y="${cy-24}" text-anchor="middle">−</text><text class="lbl" x="${cx}" y="${cy+36}" text-anchor="middle">battery</text>`;
  } else if(k.type==='switch'){
    const closed=set.switches[k.id]==='closed';
    if(ori==='h') s+=`<path class="sym" d="M${cx-30} ${cy} L${closed?cx+30:cx+20} ${closed?cy:cy-26}"/><text class="lbl" x="${cx}" y="${cy+30}" text-anchor="middle">switch: ${closed?'closed':'open'}</text>`;
    else s+=`<path class="sym" d="M${cx} ${cy-30} L${closed?cx:cx+26} ${closed?cy+30:cy+20}"/><text class="lbl" x="${cx-14}" y="${cy+4}" text-anchor="end">switch: ${closed?'closed':'open'}</text>`;
  } else if(k.type==='bulb'){
    const st=o.lit?o.lit[k.id]:undefined;
    const lead=ori==='v'?`M${cx} ${cy-30} V${cy-20} M${cx} ${cy+20} V${cy+30}`:`M${cx-30} ${cy} H${cx-20} M${cx+20} ${cy} H${cx+30}`;
    const word=st===true?'ON':st===false?'OFF':'not tested';
    const tx=ori==='v'?`<text class="lbl" x="${cx-44}" y="${cy-4}" text-anchor="end">${esc(k.name.toLowerCase())}</text><text class="lbl-strong" x="${cx-44}" y="${cy+14}" text-anchor="end">${word}</text>`
      :`<text class="lbl" x="${cx}" y="${cy+42}" text-anchor="middle">${esc(k.name.toLowerCase())}</text><text class="lbl-strong" x="${cx}" y="${cy+58}" text-anchor="middle">${word}</text>`;
    s+=`<g class="${st===true?'lit':''}">${st===true?rays(cx,cy,27,38):''}<path class="sym" d="${lead}"/><circle class="glass" cx="${cx}" cy="${cy}" r="20"/><path class="sym" style="stroke-width:2.5" d="M${cx-13} ${cy-13} L${cx+13} ${cy+13} M${cx+13} ${cy-13} L${cx-13} ${cy+13}"/></g>${tx}`;
  }
  return s;
}
function describeCircuit(L,set,lit){
  const parts=L.connectors.map(c=>`${c.name}: ${matName(set.connectors[c.id])}`);
  const bulbs=L.components.filter(k=>k.type==='bulb').map(b=>`${b.name} ${lit&&lit[b.id]!==undefined?(lit[b.id]?'on':'off'):'not tested'}`);
  return `${L.title} circuit. Switch ${set.switches.sw}. ${parts.join('. ')}.${L.loose?' A loose wire crosses the lamp-to-switch wire on the drawing but is not joined to any terminal.':''} ${bulbs.join(', ')}.`;
}
function inspectText(L,set,step){
  if(step==='start') return 'Start at the battery + terminal.';
  if(step==='end') return 'Back at the battery − terminal. Every part on the way must conduct for the loop to be complete.';
  const k=L.components.find(x=>x.id===step);
  if(k&&k.type==='switch') return `Switch: ${set.switches.sw}. ${set.switches.sw==='closed'?'It joins its two terminals.':'It leaves a gap between its terminals.'}`;
  if(k&&k.type==='bulb') return `${k.name}: its filament joins its two terminals.`;
  const c=L.connectors.find(x=>x.id===step),m=set.connectors[step];
  return `${c.name}: ${m==null?'nothing joins these two terminals. There is a gap here.':cond(m)?`a ${MAT_NAME[m]} joins these terminals. It conducts.`:`a ${MAT_NAME[m]} joins these terminals. It does not conduct.`}`;
}
function cleanCircuit(L,s,fallback){
  const out=clone(fallback);
  if(!s||typeof s!=='object') return out;
  for(const c of L.connectors){const v=s.connectors&&s.connectors[c.id]; if(v===null||(typeof v==='string'&&v in CONDUCTS)) out.connectors[c.id]=v;}
  const v=s.switches&&s.switches.sw; if(v==='open'||v==='closed') out.switches.sw=v;
  return out;
}
function cleanSolar(s,fallback){const out=clone(fallback);if(s&&typeof s==='object') for(const k in SOLAR_KEYS) if(SOLAR_KEYS[k].includes(s[k])) out[k]=s[k];return out;}

function sayBtn(text){

}

function pill(on){return `<span class="pill ${on?'on':'off'}">${on?'On':'Off'}</span>`;}
function chipsFor(st){

}
function hash(s){let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return h;}
function shuffled(arr,seed){
  const a=arr.slice();let h=hash(seed);
  for(let i=a.length-1;i>0;i--){h=(h*1103515245+12345)|0;const j=Math.abs(h)%(i+1);[a[i],a[j]]=[a[j],a[i]];}
  if(a.every((x,i)=>x===arr[i])) a.push(a.shift());
  return a;
}

/* ================= Engines =================
   Each activity type supplies its own state, trial record, default requirements and screens.
   Requirements are always recomputed from the trial records. */
const ENG={
sort:{
  init:()=>({place:{}}),
  clean(cfg,p){const out={place:{}};const bins=cfg.bins.map(b=>b[0]);if(p&&p.place) for(const it of cfg.items) if(bins.includes(p.place[it[0]])) out.place[it[0]]=p.place[it[0]];return out;},
  cleanTrial(cfg,t){return t&&t.place?{n:t.n,place:ENG.sort.clean(cfg,t).place}:null;},
  evalT:(cfg,T)=>T.map(t=>({placed:cfg.items.every(i=>t.place[i[0]]),correct:cfg.items.every(i=>t.place[i[0]]===i[2]),wrong:cfg.items.filter(i=>t.place[i[0]]&&t.place[i[0]]!==i[2]).map(i=>i[0])})),
  reqs:[['Put every card in a group, then check.',T=>T.some(x=>x.placed)],['Fix any cards until every card is in the right group.',T=>T.some(x=>x.correct)]],
  view(d,ms){
    const cfg=d.play,p=ms.play,last=ms.trials[ms.trials.length-1];
    const fresh=last&&sameSet(last.place,p.place);
    const wrong=fresh?ENG.sort.evalT(cfg,[last])[0].wrong:[];
    const all=cfg.items.every(i=>p.place[i[0]]);
    if(big(d)) return ENG.sort.oneAtATime(d,ms,wrong,all);
    return `<p>${esc(cfg.instr)}</p>${sayBtn(cfg.instr)}
    <div class="sortlist">${cfg.items.map(i=>`<div class="sortitem ${wrong.includes(i[0])?'redo':''}"><div class="what">${picHTML(i[4],52)}<span>${esc(i[1])}${wrong.includes(i[0])?' <span class="flag">↻ look again</span>':''}</span></div>
      <div class="binbtns" role="group" aria-label="Group for ${esc(i[1])}">${cfg.bins.map(b=>`<button type="button" class="btn" id="pl-${i[0]}-${b[0]}" data-action="sort-place" data-item="${i[0]}" data-bin="${b[0]}" aria-pressed="${p.place[i[0]]===b[0]}">${esc(b[1])}</button>`).join('')}</div></div>`).join('')}</div>
    <div class="row"><button type="button" class="btn primary big" id="sort-check" data-action="sort-check" ${all?'':'disabled'}>Check my groups</button><span class="muted small">${cfg.items.filter(i=>p.place[i[0]]).length} of ${cfg.items.length} placed</span></div>`;
  },
  /* Grades 1–2: one big card and one decision at a time; placed cards stay visible and can be changed. */
  oneAtATime(d,ms,wrong,all){
    const cfg=d.play,p=ms.play,n=cfg.items.length;
    let focus=UI.sortFocus&&cfg.items.find(i=>i[0]===UI.sortFocus);
    if(!focus&&!all) focus=cfg.items.find(i=>!p.place[i[0]]);
    const k=focus?cfg.items.indexOf(focus)+1:n;
    const binLabel=id=>(cfg.bins.find(b=>b[0]===id)||[])[1];
    return `<p style="font-size:1.2rem">${esc(cfg.instr)}</p>${sayBtn(cfg.instr)}
    ${focus?`<div class="bigcard" aria-live="polite"><p class="eyebrow">Card ${k} of ${n}</p>${picHTML(focus[4],120)}<p class="bigcard-name">${esc(focus[1])}</p></div>
      <p style="font-size:1.1rem"><b>Where does it go?</b></p>
      <div class="pics" role="group" aria-label="Group for ${esc(focus[1])}">${cfg.bins.map(b=>`<button type="button" class="pic" id="pl-${focus[0]}-${b[0]}" data-action="sort-place" data-item="${focus[0]}" data-bin="${b[0]}" aria-pressed="${p.place[focus[0]]===b[0]}">${b[2]&&PIC[b[2]]?PIC[b[2]]():''}<span>${esc(b[1])}</span></button>`).join('')}</div>`
      :`<div class="row"><button type="button" class="btn primary big" id="sort-check" data-action="sort-check">Check my groups</button></div>`}
    ${Object.keys(p.place).length?`<div class="stack"><p class="small muted">Your cards. Tap one to change it.</p><div class="minis">${cfg.items.filter(i=>p.place[i[0]]).map(i=>`<button type="button" class="mini ${wrong.includes(i[0])?'redo':''}" id="mini-${i[0]}" data-action="sort-focus" data-item="${i[0]}" aria-label="${esc(i[1])}: ${esc(binLabel(p.place[i[0]]))}${wrong.includes(i[0])?'. Look again.':''}">${picHTML(i[4],40)}<span>${esc(binLabel(p.place[i[0]]))}</span>${wrong.includes(i[0])?'<span class="flag">↻</span>':''}</button>`).join('')}</div></div>`:''}`;
  },
  evidence(d,ms){
    const cfg=d.play,first=ms.trials[0],r=first?ENG.sort.evalT(cfg,[first])[0]:null;
    const firstRight=first?cfg.items.filter(i=>first.place[i[0]]===i[2]).length:0;
    return `<div class="panel"><p class="eyebrow">Your groups</p><div class="tablewrap"><table><thead><tr><th>Card</th><th>Group</th><th>Why</th></tr></thead><tbody>
    ${cfg.items.map(i=>`<tr><td><div class="row">${picHTML(i[4],36)}<b>${esc(i[1])}</b></div></td><td>${esc(cfg.bins.find(b=>b[0]===i[2])[1])}</td><td>${esc(i[3])}</td></tr>`).join('')}</tbody></table></div>
    ${r?`<p class="muted small">First check: ${firstRight} of ${cfg.items.length} right. Checks made: ${ms.trials.length}.</p>`:''}</div>`;
  }
},
sequence:{
  init:()=>({seq:[]}),
  clean(cfg,p){const ids=cfg.cards.map(c=>c[0]);const seq=(p&&Array.isArray(p.seq)?p.seq:[]).filter((x,i,a)=>ids.includes(x)&&a.indexOf(x)===i);return {seq};},
  cleanTrial(cfg,t){return t&&Array.isArray(t.seq)?{n:t.n,seq:ENG.sequence.clean(cfg,t).seq}:null;},
  evalT:(cfg,T)=>T.map(t=>({complete:t.seq.length===cfg.cards.length,correct:t.seq.length===cfg.cards.length&&t.seq.every((x,i)=>x===cfg.cards[i][0])})),
  reqs:[['Put all the cards in order, then check.',T=>T.some(x=>x.complete)],['Fix the order until it is right.',T=>T.some(x=>x.correct)]],
  view(d,ms){
    const cfg=d.play,seq=ms.play.seq,byId=Object.fromEntries(cfg.cards.map(c=>[c[0],c]));
    const left=shuffled(cfg.cards.map(c=>c[0]),d.id).filter(x=>!seq.includes(x));
    return `<p${big(d)?' style="font-size:1.2rem"':''}>${esc(cfg.instr)}</p>${sayBtn(cfg.instr)}

/* ================= Progress ================= */
function reqsOf(d,ms){
  const cfg=d.play,E=ENG[cfg.engine],T=E.evalT(cfg,ms.trials),R=cfg.reqs||E.reqs;
  return R.map(([label,fn])=>({label,met:!!fn(T)}));
}
const okOpt=(q,v)=>{const o=q.options.find(x=>x.id===v);return !!(o&&o.ok);};
const qDone=(ms,qs,pre)=>qs.every((q,i)=>ms.checked[pre+i]&&okOpt(q,ms.answers[pre+i]));
const explainCorrect=(d,ms)=>qDone(ms,d.explain,'e');
const transferDone=(d,ms)=>qDone(ms,d.transfer.qs,'t');
function statusOf(d,ms){
  if(!ms) return {started:false,explored:false,practised:false,demonstrated:false,assisted:false};
  const practised=reqsOf(d,ms).every(r=>r.met),ex=explainCorrect(d,ms),td=transferDone(d,ms);
  return {started:true,explored:ms.interacted||ms.trials.length>0,practised,demonstrated:practised&&ex&&td&&ms.hints.transfer===0,assisted:practised&&ex&&td&&ms.hints.transfer>0};
}
function maxStep(d,ms){
  if(!ms.prediction) return 1;
  if(!reqsOf(d,ms).every(r=>r.met)) return 2;
  if(!explainCorrect(d,ms)) return 4;
  if(!transferDone(d,ms)) return 5;
  return 6;
}
const hintsUsed=ms=>ms.hints.play+ms.hints.explain+ms.hints.transfer;

/* ================= Store ================= */
function freshStore(){return {schema:1,game:'power-the-island',grade:4,prefs:{mute:false,reducedMotion:false,sfx:true},missions:{},archived:{},current:null,rewards:freshRewards()};}
function freshTState(d){
  const f=d.transfer.fig;
  if(!f) return {tested:false};
  if(f.type==='circuit'||f.type==='solar') return {set:clone(f.set),tested:false};
  if(f.type==='switch') return {sw:f.sw,tested:false};
  return {tested:false};
}
function freshMission(d){
  return {missionId:d.id,contentVersion:d.version,grade:d.grade,step:'brief',interacted:false,prediction:null,
    play:ENG[d.play.engine].init(d.play),trials:[],trialCount:0,answers:{},checked:{},
    hints:{play:0,explain:0,transfer:0},tState:freshTState(d),switchCloses:0,updatedAt:null};
}
function sanitizeMission(d,m){
  const f=freshMission(d),E=ENG[d.play.engine];
  if(!m||typeof m!=='object') return f;
  f.interacted=m.interacted===true;
  const p=m.prediction;
  if(p&&d.predict.options.some(o=>o.id===p.choice)) f.prediction={choice:p.choice,reason:d.predict.reasons.some(r=>r.id===p.reason)?p.reason:null,aloud:p.aloud===true};
  f.play=E.clean(d.play,m.play);
  f.trials=(Array.isArray(m.trials)?m.trials.slice(-MAX_TRIALS):[]).map(t=>{const c=E.cleanTrial(d.play,t);if(c) c.n=Number.isInteger(t.n)&&t.n>0?t.n:0;return c;}).filter(Boolean);
  f.trialCount=f.trials.reduce((a,t)=>Math.max(a,t.n),0);
  const qs=[...d.explain.map((q,i)=>['e'+i,q]),...d.transfer.qs.map((q,i)=>['t'+i,q])];
  for(const [k,q] of qs){
    const v=m.answers&&m.answers[k];
    if(q.options.some(o=>o.id===v)){f.answers[k]=v;if(m.checked&&m.checked[k]===true) f.checked[k]=true;}
  }
  if(m.answers&&m.answers.aloud===true) f.answers.aloud=true;
  for(const k in f.hints){const v=m.hints&&m.hints[k];if(Number.isInteger(v)) f.hints[k]=Math.max(0,Math.min(3,v));}
  const fig=d.transfer.fig,ts=m.tState||{};
  if(fig&&fig.type==='circuit') f.tState.set=cleanCircuit(LAYOUTS[fig.layout],ts.set,fig.set);
  if(fig&&fig.type==='solar') f.tState.set=cleanSolar(ts.set,fig.set);
  if(fig&&fig.type==='switch'&&(ts.sw==='open'||ts.sw==='closed')) f.tState.sw=ts.sw;
  f.tState.tested=ts.tested===true;
  f.switchCloses=Number.isInteger(m.switchCloses)?Math.max(0,m.switchCloses):0;
  f.updatedAt=typeof m.updatedAt==='string'?m.updatedAt:null;
  const want=STEPS.indexOf(m.step);
  f.step=STEPS[Math.max(0,Math.min(want<0?0:want,maxStep(d,f)))];
  return f;
}
let storageOK=true,loadNotices=[];
function probeStorage(){try{const k=KEY+'.probe';localStorage.setItem(k,'1');localStorage.removeItem(k);return true;}catch(e){return false;}}
function loadStore(){
  const out=freshStore();
  storageOK=probeStorage();
  if(!storageOK) return out;
  let raw=null;
  try{const s=localStorage.getItem(KEY);raw=s?JSON.parse(s):null;}catch(e){loadNotices.push('Saved progress couldn’t be read, so the game started fresh.');return out;}
  if(!raw||typeof raw!=='object') return out;
  if(raw.schema!==1){loadNotices.push('Saved progress came from a version this game doesn’t recognise. It started fresh.');return out;}
  if([1,2,3,4,5,6].includes(raw.grade)) out.grade=raw.grade;
  if(raw.prefs){out.prefs.mute=raw.prefs.mute===true;out.prefs.reducedMotion=raw.prefs.reducedMotion===true;out.prefs.sfx=raw.prefs.sfx!==false;}
  if(raw.archived&&typeof raw.archived==='object') out.archived=raw.archived;
  out.rewards=raw.rewards;   /* cleaned once the reward rules have loaded */
  for(const id in (raw.missions||{})){
    const d=MISSIONS[id],m=raw.missions[id];
    if(!d){out.archived[id]=m;continue;}
    if(!m||m.contentVersion!==d.version){
      out.archived[id+'@'+(m&&m.contentVersion||'unknown')]=m;
      loadNotices.push(`“${d.title}” has changed since you last played, so it will start fresh. Your old record is kept in the export.`);
      continue;
    }
    out.missions[id]=sanitizeMission(d,m);
  }
  if(raw.current&&out.missions[raw.current]) out.current=raw.current;
  return out;
}
function save(){
  const m=cur();if(m) m.updatedAt=new Date().toISOString();
  if(!storageOK) return;
  try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){storageOK=false;}
}

/* Short synthesised sounds. They only repeat what the screen already shows, so they need no captions. */
let AC=null;
const TONES={tap:[[620,.05]],ok:[[660,.09],[880,.16]],retry:[[392,.1],[330,.16]],lit:[[523,.07],[659,.07],[784,.18]],off:[[300,.12]],stamp:[[523,.09],[659,.09],[784,.09],[1047,.3]]};
function sfx(kind){
  if(!S.prefs.sfx) return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    let t=AC.currentTime+.01;
    for(const [f,dur] of TONES[kind]||[]){
      const o=AC.createOscillator(),g=AC.createGain();
      o.type='triangle';o.frequency.value=f;
      g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.09,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
      o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+dur+.03);t+=dur*.85;
    }
  }catch(e){}
}

/* Home fits one screen: compact progress strip, an optional Continue button, and six grade tiles

function modelChecks(){
  const A=LAYOUTS.path,B=LAYOUTS.class,K=LAYOUTS.series;
  const r=(L,c)=>runModel(L,{connectors:c,switches:{sw:'closed'}});
  const cross=r(B,{c1:'metal',c2:'metal',c3:'metal'});
  const plastic=r(A,{w1:'metal',w2:'metal',w3:'plastic'});
  const brk=['s1','s2','s3','s4'].map(k=>{const c={s1:'metal',s2:'metal',s3:'metal',s4:'metal'};c[k]=null;return allOff(r(K,c));});
  const whole=r(K,{s1:'metal',s2:'metal',s3:'metal',s4:'metal'});
  const short=runModel({components:[comp('bat','battery','v',0,0,''),comp('b1','bulb','v',0,0,'')],connectors:[{id:'k1',a:'bat.p',b:'b1.a'},{id:'k2',a:'b1.b',b:'bat.n'},{id:'k3',a:'bat.p',b:'bat.n'}]},{connectors:{k1:'metal',k2:'metal',k3:'metal'},switches:{}});
  const bad=r(A,{w1:'metal',w2:'copper?',w3:'metal'});
  const night=runSolar({panel:'yes',site:'sun',storage:'no',time:'night'});
  const nightStore=runSolar({panel:'yes',site:'sun',storage:'yes',time:'night'});
  return [
    ['A visual wire crossing is not an electrical connection (classroom lamp lights with the loose wire ignored).',allOn(cross)],
    ['A closed switch plus a plastic connector leaves the bulb off.',allOff(plastic)],
    ['A break anywhere in the two-bulb series loop turns both bulbs off (4 break positions).',brk.every(Boolean)&&allOn(whole)],
    ['Night-time solar missions can’t succeed with only an unlit panel.',night.status==='ok'&&!night.lit&&nightStore.lit],
    ['Short-circuit layouts are rejected as unsupported.',short.status==='unsupported'],
    ['An unknown material returns “model unavailable”, never a guessed result.',bad.status==='unavailable']];
}

function qFlow(d,ms,qs,pre){

}

    const L=LAYOUTS[f.layout],ti=currentTapQ(d,ms),sel=ti>=0?ms.answers['t'+ti]:null;
    const r=ms.tState.tested?runModel(L,ms.tState.set):null;

  }
  if(f.type==='solar'){const r=ms.tState.tested?runSolar(ms.tState.set):null;return `<figure class="figure">${solarScene(ms.tState.set,r)}</figure>`;}
  if(f.type==='switch'){

function runTest(kind){

    announce(r.status!=='ok'?'Model unavailable for this layout.':kind==='circuit'?`Test ${ms.trialCount}: `+Object.entries(r.lit).map(([k,v])=>`${LAYOUTS[d.play.layout].components.find(c=>c.id===k).name} ${v?'on':'off'}`).join(', ')+'.':`Test ${ms.trialCount}: lamp ${r.lit?'on':'off'}.`);
  },S.prefs.reducedMotion?0:380);
}
